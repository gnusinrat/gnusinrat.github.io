<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Продвинутая Рисовалка с Gemini</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg: #f0f2f5;
            --panel-bg: #ffffff;
            --text: #111827;
            --text-secondary: #6b7280;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --danger: #ef4444;
            --border: #e5e7eb;
            --shadow: 0 4px 12px rgba(0,0,0,0.1);
            --canvas-bg: #ffffff;
            --btn-primary-text: #ffffff;
            --btn-secondary-bg: #e5e7eb;
            --btn-secondary-text: #374151;
            --tool-active: #1d4ed8;
            --blue-text: #3b82f6;
            color-scheme: light;
        }

        [data-theme="dark"] {
            --bg: #1f2937;
            --panel-bg: #111827;
            --text: #f9fafb;
            --text-secondary: #9ca3af;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --danger: #f87171;
            --border: #374151;
            --shadow: 0 4px 12px rgba(0,0,0,0.4);
            --canvas-bg: #1e1e1e;
            --btn-primary-text: #ffffff;
            --btn-secondary-bg: #374151;
            --btn-secondary-text: #e5e7eb;
            --tool-active: #6d28d9;
            --blue-text: #a78bfa;
            color-scheme: dark;
        }

        [data-theme="dark"] .bg-white,
        [data-theme="dark"] .bg-gray-100,
        [data-theme="dark"] .bg-gray-50,
        [data-theme="dark"] .bg-gray-200 { background-color: var(--panel-bg) !important; }
        [data-theme="dark"] .text-gray-800,
        [data-theme="dark"] .text-gray-700,
        [data-theme="dark"] .text-gray-600,
        [data-theme="dark"] .text-gray-900 { color: var(--text) !important; }
        [data-theme="dark"] .text-gray-500,
        [data-theme="dark"] .text-gray-400 { color: var(--text-secondary) !important; }
        [data-theme="dark"] .text-blue-600 { color: var(--blue-text) !important; }
        [data-theme="dark"] .border-gray-300 { border-color: var(--border) !important; }

        body {
            font-family: "Inter", sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .screen { display: none; }
        .screen.active { display: block; }
        #drawingScreen.active {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .left-panel {
            width: 250px;
            flex-shrink: 0;
            background-color: var(--panel-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .main-drawing-area {
            flex-grow: 1;
            background-color: var(--panel-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
            position: relative;
        }
        canvas {
            border: 2px solid var(--accent);
            background-color: var(--canvas-bg);
            cursor: none;
            touch-action: none;
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: var(--shadow);
        }
        #customCursor {
            position: fixed;
            border: 1px solid #333;
            border-radius: 50%;
            pointer-events: none;
            display: none;
            transform: translate(-50%, -50%);
            z-index: 1000;
            background-color: rgba(0,0,0,0.1);
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background-color: var(--btn-secondary-bg);
            color: var(--btn-secondary-text);
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary {
            background-color: var(--accent);
            color: var(--btn-primary-text);
        }
        .btn-primary:hover:not(:disabled) {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }
        .btn-primary.active {
            background-color: var(--tool-active);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
            transform: translateY(0);
        }
        .btn-clear { background-color: var(--danger); color: white; }
        .btn-save { background-color: #22c55e; color: white; }
        .btn-gemini {
            background: linear-gradient(45deg, #4285f4, #9b72cb, #d96570, #f2a600);
            color: white;
        }
        .btn-dev-switch {
            background: linear-gradient(45deg, #ef4444, #f97316);
            color: white;
        }
        .btn-stable-switch {
            background: linear-gradient(45deg, #22c55e, #84cc16);
            color: white;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal-overlay.show { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: var(--panel-bg);
            color: var(--text);
            padding: 30px; border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            width: 90%; max-width: 500px; text-align: center;
            position: relative; transform: scale(0.9); transition: transform 0.3s;
        }
        .modal-overlay.show .modal-content { transform: scale(1); }
        .modal-close {
            position: absolute; top: 15px; right: 15px;
            font-size: 24px; font-weight: bold; cursor: pointer; color: #aaa;
        }
        .modal-close:hover { color: #333; }

        #geminiPrompt { margin-top: 20px; min-height: 50px; font-size: 1.2rem; color: var(--text); }
        .loader {
            border: 4px solid #f3f3f3; border-top: 4px solid var(--accent);
            border-radius: 50%; width: 40px; height: 40px;
            animation: spin 1s linear infinite; margin: 20px auto;
        }
        @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }

        #ideaListContainer {
            background: var(--btn-secondary-bg); padding: 8px; border-radius: 8px;
            max-height: 120px; overflow-y: auto; width: 100%;
        }
        .idea-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 6px; font-size: 14px; border-bottom: 1px solid var(--border); color: var(--text);
        }
        .idea-item:last-child { border-bottom: none; }
        .copy-idea-btn { background: none; border: none; cursor: pointer; padding: 4px; color: var(--text-secondary); }
        .copy-idea-btn:hover svg { color: var(--accent); }

        #drawingGrid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px; margin-top: 20px;
        }
        .drawing-thumbnail {
            background: var(--panel-bg); border-radius: 12px; box-shadow: var(--shadow);
            overflow: hidden; cursor: pointer; transition: transform 0.2s; position: relative;
        }
        .drawing-thumbnail:hover { transform: translateY(-5px); }
        .drawing-thumbnail img { width: 100%; height: 150px; object-fit: cover; border-bottom: 1px solid var(--border); }
        .thumbnail-info { padding: 10px; font-size: 14px; color: var(--text-secondary); }
        .delete-drawing-btn {
            position: absolute; top: 8px; right: 8px; background: rgba(239,68,68,0.8);
            color: white; border: none; border-radius: 50%; width: 28px; height: 28px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 16px;
        }

        .layer-panel {
            background: var(--panel-bg); border-radius: 8px; padding: 8px;
            margin-top: 10px; width: 100%; box-shadow: var(--shadow);
        }
        .layer-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 4px 8px; cursor: pointer; border-radius: 4px; color: var(--text);
        }
        .layer-item.active { background: var(--accent); color: white; }
        .advanced-color { display: flex; flex-direction: column; gap: 4px; width: 100%; }
        .color-input-group { display: flex; gap: 4px; align-items: center; }
        .color-input-group input {
            width: 60px; padding: 2px; border: 1px solid var(--border);
            border-radius: 4px; background: var(--panel-bg); color: var(--text);
        }

        .tool-icon { width: 20px; height: 20px; margin-right: 6px; }

        @media (max-width: 768px) {
            #drawingScreen.active { flex-direction: column; }
            .left-panel { width: 100%; order: 2; }
            .main-drawing-area { max-width: 100%; order: 1; }
        }
    </style>
</head>
<body>
    <div id="dataConsentBanner" class="fixed top-5 left-1/2 -translate-x-1/2 w-11/12 max-w-4xl p-4 bg-yellow-200 border border-yellow-400 text-yellow-900 rounded-lg shadow-lg flex items-center justify-between z-[10000]" style="display:none">
        <p class="text-sm"><strong>Предупреждение:</strong> Этот сайт использует cookie для сохранения идей и рисунков.</p>
        <button id="consentButton" class="ml-4 text-2xl font-bold">&times;</button>
    </div>

    <div id="confirmationModal" class="modal-overlay">
        <div class="modal-content">
            <p id="confirmationMessage" class="text-lg"></p>
            <div class="flex gap-4 mt-6">
                <button id="confirmYesBtn" class="btn btn-clear flex-1">Да</button>
                <button id="confirmNoBtn" class="btn btn-secondary flex-1">Нет</button>
            </div>
        </div>
    </div>

    <div id="notificationModal" class="modal-overlay">
        <div class="modal-content">
            <p id="notificationMessage" class="text-lg"></p>
            <button id="notificationCloseBtn" class="btn btn-primary mt-6 w-full">OK</button>
        </div>
    </div>

    <div id="versionSwitchModal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="versionSwitchTitle" class="text-2xl font-bold"></h3>
            <p id="versionSwitchMessage" class="mt-4"></p>
            <div class="flex gap-4 mt-6">
                <button id="cancelSwitchBtn" class="btn btn-secondary flex-1">Отмена</button>
                <button id="confirmSwitchBtn" class="btn flex-1">Подтвердить</button>
            </div>
        </div>
    </div>

    <!-- Окно настроек (только в dev) -->
    <div id="settingsModal" class="modal-overlay">
        <div class="modal-content">
            <span class="modal-close" id="settingsModalClose">&times;</span>
            <h3 class="text-2xl font-bold mb-4">Настройки</h3>
            <div class="flex flex-col gap-4">
                <button id="exportDataBtn" class="btn btn-secondary w-full">Экспорт данных</button>
                <label for="importDataInput" class="btn btn-secondary cursor-pointer w-full">Импорт данных</label>
                <input type="file" id="importDataInput" class="hidden" accept=".json"/>
                <div class="theme-toggle">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="darkThemeCheckbox">
                        <span>Тёмная тема</span>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <!-- Экран Галереи -->
    <div id="galleryScreen" class="screen active relative">
        <div class="flex justify-between items-center flex-wrap gap-4">
            <h1 class="text-4xl font-extrabold text-gray-800">
                <span class="text-blue-600">Ваша</span> Галерея
            </h1>
            <div class="flex gap-4 items-center">
                <!-- Кнопка настроек только в dev -->
                <button id="settingsBtn" class="btn btn-secondary p-2" style="display: none" title="Настройки">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                </button>
                <div id="stableExportImport" class="flex gap-4">
                    <button id="exportDataBtnStable" class="btn btn-secondary">Экспорт данных</button>
                    <label for="importDataInputStable" class="btn btn-secondary cursor-pointer">Импорт данных</label>
                    <input type="file" id="importDataInputStable" class="hidden" accept=".json"/>
                </div>
                <button id="newDrawingBtn" class="btn btn-primary">Новый рисунок</button>
            </div>
        </div>
        <div id="drawingGrid"></div>
        <div class="absolute bottom-0 left-0 text-sm" style="color: var(--text-secondary);">
            <span id="versionText"></span>
            <span id="betaText" class="text-orange-500 font-bold hidden">beta!</span>
        </div>
        <div id="versionSwitchContainer" class="absolute bottom-5 left-1/2 -translate-x-1/2"></div>
    </div>

    <!-- Экран Рисования -->
    <div id="drawingScreen" class="screen">
        <div class="left-panel">
            <button id="backToGalleryBtn" class="btn btn-primary w-full mb-4">Назад в галерею</button>
            <h2 class="text-2xl font-bold mb-4">Инструменты</h2>
            <button id="pencilTool" class="btn btn-primary w-full">Карандаш</button>
            <button id="eraserTool" class="btn btn-primary w-full">Ластик</button>
            <button id="rectangleTool" class="btn btn-primary w-full">Прямоугольник</button>
            <button id="circleTool" class="btn btn-primary w-full">Круг</button>
            <button id="lineTool" class="btn btn-primary w-full">Линия</button>
            <button id="eyedropperTool" class="btn btn-primary w-full flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m13.5 2.5-3 3a2.5 2.5 0 0 0 0 3.5l7 7a2.5 2.5 0 0 0 3.5 0l3-3a2.5 2.5 0 0 0 0-3.5l-7-7a2.5 2.5 0 0 0-3.5 0Z"/><path d="m22 22-5-5"/><path d="m2 2 5 5"/></svg>
                Пипетка
            </button>
            <div id="devToolsContainer" style="display:none; width:100%">
                <button id="fillTool" class="btn btn-primary w-full"><svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 11H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2Z"/><path d="m5 11 7-7 7 7"/></svg>Заливка</button>
                <button id="sprayTool" class="btn btn-primary w-full"><svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="8" r="1"/><circle cx="14" cy="8" r="1"/><circle cx="11" cy="13" r="1"/><circle cx="17" cy="13" r="1"/><circle cx="8" cy="18" r="1"/></svg>Распылитель</button>
                <button id="textTool" class="btn btn-primary w-full"><svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>Текст</button>
            </div>
            <div class="w-full h-px bg-gray-300 my-4"></div>
            <div id="aiFeatures" class="w-full text-center">
                <button id="geminiIdeaButton" class="btn btn-gemini w-full">✨ Идея для рисунка</button>
                <p class="text-xs text-gray-500 mt-1">API Gemini 2.0 Flash</p>
            </div>
            <div id="ideaLibrarySection" class="w-full text-center">
                <h4 class="text-md font-semibold mt-2">Библиотека идей</h4>
                <div id="ideaListContainer"><p class="text-gray-400 text-center p-4">Здесь будут сохраненные идеи...</p></div>
                <button id="clearLibraryButton" class="text-xs text-red-500 hover:underline mt-2">Очистить</button>
            </div>
            <div class="w-full h-px bg-gray-300 my-4"></div>
            <label for="colorPicker" class="font-medium self-start">Цвет:</label>
            <input type="color" id="colorPicker" value="#000000" />
            <div id="advancedColorContainer" class="advanced-color" style="display:none">
                <div class="color-input-group">
                    <span>R:</span><input type="number" id="redInput" min="0" max="255" value="0">
                    <span>G:</span><input type="number" id="greenInput" min="0" max="255" value="0">
                    <span>B:</span><input type="number" id="blueInput" min="0" max="255" value="0">
                </div>
                <div class="color-input-group">
                    <span>HEX:</span><input type="text" id="hexInput" value="#000000" style="width:80px">
                </div>
            </div>
            <label for="lineWidth" class="font-medium self-start mt-2">Толщина:</label>
            <div class="flex items-center w-full">
                <input type="range" id="lineWidth" min="1" max="50" value="5" />
                <span id="lineWidthValue" class="font-medium ml-2">5</span>
            </div>
            <div id="layersContainer" class="layer-panel" style="display:none">
                <h4 class="text-md font-semibold mb-2">Слои</h4>
                <div id="layerList"></div>
                <button id="addLayerBtn" class="btn btn-secondary w-full mt-2">+ Добавить слой</button>
            </div>
        </div>
        <div class="main-drawing-area">
            <canvas id="drawingCanvas" width="800" height="600"></canvas>
            <div class="controls flex items-center gap-4 mt-4">
                <button id="clearButton" class="btn btn-clear">Очистить</button>
                <div id="saveContainer">
                    <button id="saveButton" class="btn btn-save">Скачать PNG</button>
                </div>
            </div>
        </div>
    </div>

    <div id="customCursor"></div>
    <div id="geminiModal" class="modal-overlay">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h3 class="text-2xl font-bold">Генератор идей</h3>
            <div class="flex gap-2 mt-4">
                <button id="funnyIdeaBtn" class="btn btn-primary flex-1">Смешная</button>
                <button id="seriousIdeaBtn" class="btn btn-primary flex-1">Серьёзная</button>
            </div>
            <div class="mt-4">
                <input type="text" id="customMoodInput" placeholder="Своё настроение..." class="w-full p-2 border rounded-md">
                <button id="customIdeaBtn" class="btn btn-gemini w-full mt-2">✨ Сгенерировать</button>
            </div>
            <div id="geminiPrompt"></div>
        </div>
    </div>

    <script>
        const isDevVersion = new URLSearchParams(window.location.search).get("env") === "dev";
        const drawingsKey = isDevVersion ? "myDrawings_dev" : "myDrawings";
        const ideasKey = isDevVersion ? "drawingIdeas_dev" : "drawingIdeas";

        // DOM элементы
        const confirmationModal = document.getElementById("confirmationModal");
        const confirmationMessage = document.getElementById("confirmationMessage");
        const confirmYesBtn = document.getElementById("confirmYesBtn");
        const confirmNoBtn = document.getElementById("confirmNoBtn");
        const notificationModal = document.getElementById("notificationModal");
        const notificationMessage = document.getElementById("notificationMessage");
        const notificationCloseBtn = document.getElementById("notificationCloseBtn");
        const galleryScreen = document.getElementById("galleryScreen");
        const drawingScreen = document.getElementById("drawingScreen");
        const drawingGrid = document.getElementById("drawingGrid");
        const canvas = document.getElementById("drawingCanvas");
        const ctx = canvas.getContext("2d");
        const colorPicker = document.getElementById("colorPicker");
        const lineWidth = document.getElementById("lineWidth");
        const lineWidthValue = document.getElementById("lineWidthValue");
        const customCursor = document.getElementById("customCursor");

        const toolButtons = {
            pencil: document.getElementById("pencilTool"),
            eraser: document.getElementById("eraserTool"),
            rectangle: document.getElementById("rectangleTool"),
            circle: document.getElementById("circleTool"),
            line: document.getElementById("lineTool"),
            eyedropper: document.getElementById("eyedropperTool"),
        };
        const fillTool = document.getElementById("fillTool");
        const sprayTool = document.getElementById("sprayTool");
        const textTool = document.getElementById("textTool");
        const devToolsContainer = document.getElementById("devToolsContainer");
        const advancedColorContainer = document.getElementById("advancedColorContainer");
        const layersContainer = document.getElementById("layersContainer");
        const layerList = document.getElementById("layerList");
        const addLayerBtn = document.getElementById("addLayerBtn");
        const saveContainer = document.getElementById("saveContainer");

        let isDrawing = false, lastX = 0, lastY = 0, startX = 0, startY = 0;
        let currentTool = "pencil", previousTool = "pencil";
        let currentDrawingId = null;
        let autoSaveInterval = null;
        const CANVAS_BG = "#ffffff";
        let layers = [{ name: "Фон" }], activeLayer = 0;

        // Модальные окна
        function showNotification(msg) {
            notificationMessage.textContent = msg;
            notificationModal.classList.add("show");
        }
        notificationCloseBtn.addEventListener("click", () => notificationModal.classList.remove("show"));
        function showConfirm(msg, cb) {
            confirmationMessage.textContent = msg;
            confirmationModal.classList.add("show");
            const newYes = confirmYesBtn.cloneNode(true);
            confirmYesBtn.parentNode.replaceChild(newYes, confirmYesBtn);
            newYes.addEventListener("click", () => { cb(); confirmationModal.classList.remove("show"); });
            confirmNoBtn.addEventListener("click", () => confirmationModal.classList.remove("show"), { once: true });
        }

        // Экраны
        function showScreen(id) {
            document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
            document.getElementById(id).classList.add("active");
            if (id === "galleryScreen") {
                renderGallery();
                if (autoSaveInterval) clearInterval(autoSaveInterval);
            } else {
                resizeCanvas();
                autoSaveInterval = setInterval(saveCurrentDrawing, 2000);
            }
        }

        // Галерея и localStorage
        function getDrawings() {
            try { return JSON.parse(localStorage.getItem(drawingsKey)) || {}; } catch { return {}; }
        }
        function saveCurrentDrawing() {
            if (!currentDrawingId || !canvas.width) return;
            const tmp = document.createElement("canvas");
            tmp.width = canvas.width; tmp.height = canvas.height;
            const tctx = tmp.getContext("2d");
            tctx.fillStyle = CANVAS_BG; tctx.fillRect(0,0,tmp.width,tmp.height);
            tctx.drawImage(canvas,0,0);
            const drawings = getDrawings();
            drawings[currentDrawingId] = {
                thumbnail: tmp.toDataURL("image/jpeg",0.5),
                full: tmp.toDataURL("image/png")
            };
            localStorage.setItem(drawingsKey, JSON.stringify(drawings));
        }
        function renderGallery() {
            const drawings = getDrawings();
            drawingGrid.innerHTML = "";
            if (!Object.keys(drawings).length) {
                drawingGrid.innerHTML = '<p class="text-center mt-10 col-span-full" style="color:var(--text-secondary)">Нет рисунков</p>';
                return;
            }
            Object.keys(drawings).sort((a,b)=>b-a).forEach(id => {
                const d = drawings[id];
                const div = document.createElement("div");
                div.className = "drawing-thumbnail";
                div.innerHTML = `<img src="${d.thumbnail}" alt=""/><div class="thumbnail-info">${new Date(+id).toLocaleString("ru")}</div><button class="delete-drawing-btn">&times;</button>`;
                div.addEventListener("click", e => {
                    if (!e.target.classList.contains("delete-drawing-btn")) loadDrawing(id);
                });
                div.querySelector(".delete-drawing-btn").addEventListener("click", () => deleteDrawing(id));
                drawingGrid.appendChild(div);
            });
        }
        function loadDrawing(id) {
            const drawings = getDrawings();
            if (drawings[id]) {
                currentDrawingId = id;
                const img = new Image();
                img.onload = () => {
                    showScreen("drawingScreen");
                    canvas.width = img.width; canvas.height = img.height;
                    ctx.drawImage(img,0,0);
                };
                img.src = drawings[id].full;
            }
        }
        function deleteDrawing(id) {
            showConfirm("Удалить рисунок?", () => {
                const d = getDrawings(); delete d[id];
                localStorage.setItem(drawingsKey, JSON.stringify(d));
                renderGallery();
            });
        }

        // Экспорт/импорт
        function exportData() {
            const data = { drawings: getDrawings(), ideas: JSON.parse(localStorage.getItem(ideasKey)||"[]") };
            const blob = new Blob([JSON.stringify(data)], {type:"application/json"});
            const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
            a.download = `backup-${Date.now()}.json`; a.click();
        }
        function importData(file) {
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const json = JSON.parse(e.target.result);
                    if (!json.drawings || !json.ideas) return showNotification("Неверный формат");
                    showConfirm("Перезаписать данные?", () => {
                        localStorage.setItem(drawingsKey, JSON.stringify(json.drawings));
                        localStorage.setItem(ideasKey, JSON.stringify(json.ideas));
                        renderGallery();
                        if (!isDevVersion) renderIdeaLibrary();
                        showNotification("Импорт выполнен");
                    });
                } catch { showNotification("Ошибка чтения файла"); }
            };
            reader.readAsText(file);
        }

        // Рисование
        function setupContext() {
            ctx.strokeStyle = currentTool === "eraser" ? CANVAS_BG : colorPicker.value;
            ctx.fillStyle = colorPicker.value;
            ctx.lineWidth = lineWidth.value;
            ctx.lineCap = ctx.lineJoin = "round";
        }
        function resizeCanvas() {
            const area = document.querySelector(".main-drawing-area");
            const ctrls = area.querySelector(".controls").offsetHeight;
            canvas.width = area.clientWidth - 40;
            canvas.height = area.clientHeight - ctrls - 80;
            setupContext();
        }
        function startDrawing(e) {
            if (["eyedropper","fill","text"].includes(currentTool)) return;
            isDrawing = true;
            const r = canvas.getBoundingClientRect();
            const x = (e.clientX||e.touches[0].clientX) - r.left;
            const y = (e.clientY||e.touches[0].clientY) - r.top;
            [lastX,lastY] = [x,y]; [startX,startY] = [x,y];
            setupContext();
        }
        function drawFreehand(e) {
            if (!isDrawing) return;
            const r = canvas.getBoundingClientRect();
            const x = (e.clientX||e.touches[0].clientX) - r.left;
            const y = (e.clientY||e.touches[0].clientY) - r.top;
            ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(x,y); ctx.stroke();
            [lastX,lastY] = [x,y];
        }
        function stopDrawing(e) {
            if (!isDrawing) return;
            isDrawing = false;
            const r = canvas.getBoundingClientRect();
            const ex = (e.clientX||e.changedTouches[0].clientX) - r.left;
            const ey = (e.clientY||e.changedTouches[0].clientY) - r.top;
            switch(currentTool) {
                case "rectangle": ctx.strokeRect(startX,startY,ex-startX,ey-startY); break;
                case "circle":
                    const rad = Math.hypot(ex-startX, ey-startY);
                    ctx.beginPath(); ctx.arc(startX,startY,rad,0,Math.PI*2); ctx.stroke(); break;
                case "line":
                    ctx.beginPath(); ctx.moveTo(startX,startY); ctx.lineTo(ex,ey); ctx.stroke(); break;
            }
        }
        function pickColor(e) {
            if (currentTool !== "eyedropper") return;
            const r = canvas.getBoundingClientRect();
            const x = e.clientX - r.left, y = e.clientY - r.top;
            const [r0,g0,b0] = ctx.getImageData(x,y,1,1).data;
            const hex = "#" + ((1<<24)+(r0<<16)+(g0<<8)+b0).toString(16).slice(1);
            colorPicker.value = hex;
            activateTool(previousTool);
        }
        function activateTool(name) {
            if (name !== "eyedropper") {
                previousTool = name;
                canvas.style.cursor = "none";
                customCursor.style.display = "block";
            } else {
                canvas.style.cursor = "copy";
                customCursor.style.display = "none";
            }
            currentTool = name;
            Object.values(toolButtons).forEach(b => b.classList.remove("active"));
            if (toolButtons[name]) toolButtons[name].classList.add("active");
            setupContext();
        }

        // Dev-инструменты
        function floodFill(x,y,fillColor) {
            const img = ctx.getImageData(0,0,canvas.width,canvas.height);
            const data = img.data;
            const target = ctx.getImageData(x,y,1,1).data;
            const [tr,tg,tb] = [target[0],target[1],target[2]];
            const [fr,fg,fb] = [parseInt(fillColor.slice(1,3),16), parseInt(fillColor.slice(3,5),16), parseInt(fillColor.slice(5,7),16)];
            if (tr===fr && tg===fg && tb===fb) return;
            const stack = [[x,y]];
            while(stack.length) {
                const [cx,cy] = stack.pop();
                if (cx<0||cy<0||cx>=canvas.width||cy>=canvas.height) continue;
                const i = (cy*canvas.width+cx)*4;
                if (data[i]===tr && data[i+1]===tg && data[i+2]===tb) {
                    data[i]=fr; data[i+1]=fg; data[i+2]=fb; data[i+3]=255;
                    stack.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);
                }
            }
            ctx.putImageData(img,0,0);
        }
        canvas.addEventListener("click", e => {
            if (currentTool === "eyedropper") pickColor(e);
            else if (currentTool === "fill") {
                const r = canvas.getBoundingClientRect();
                floodFill(Math.floor(e.clientX-r.left), Math.floor(e.clientY-r.top), colorPicker.value);
            } else if (currentTool === "text") {
                const r = canvas.getBoundingClientRect();
                const text = prompt("Введите текст:");
                if (text) {
                    ctx.font = `${lineWidth.value*3}px sans-serif`;
                    ctx.fillText(text, e.clientX-r.left, e.clientY-r.top);
                }
            }
        });

        // Слои
        function renderLayers() {
            layerList.innerHTML = "";
            layers.forEach((l,i) => {
                const d = document.createElement("div");
                d.className = "layer-item" + (i===activeLayer?" active":"");
                d.textContent = l.name;
                d.addEventListener("click", () => { activeLayer = i; renderLayers(); });
                layerList.appendChild(d);
            });
        }

        // Продвинутый цвет
        function syncAdvColor() {
            const hex = colorPicker.value;
            document.getElementById("hexInput").value = hex;
            document.getElementById("redInput").value = parseInt(hex.slice(1,3),16);
            document.getElementById("greenInput").value = parseInt(hex.slice(3,5),16);
            document.getElementById("blueInput").value = parseInt(hex.slice(5,7),16);
        }
        function updateFromRGB() {
            const r = +document.getElementById("redInput").value;
            const g = +document.getElementById("greenInput").value;
            const b = +document.getElementById("blueInput").value;
            const hex = "#" + ((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
            colorPicker.value = hex;
            document.getElementById("hexInput").value = hex;
            setupContext();
        }

        // Сохранение в разных форматах (dev)
        function downloadCanvas(format) {
            const tmp = document.createElement("canvas");
            tmp.width = canvas.width; tmp.height = canvas.height;
            const tctx = tmp.getContext("2d");
            tctx.fillStyle = CANVAS_BG; tctx.fillRect(0,0,tmp.width,tmp.height);
            tctx.drawImage(canvas,0,0);
            const mime = { png: "image/png", jpg: "image/jpeg", webp: "image/webp" }[format];
            const link = document.createElement("a");
            link.download = `drawing.${format}`;
            link.href = tmp.toDataURL(mime, format==="jpg"?0.9:1);
            link.click();
        }

        // Обработчики
        canvas.addEventListener("mousedown", startDrawing);
        canvas.addEventListener("mousemove", e => {
            if (currentTool !== "eyedropper") {
                customCursor.style.left = e.clientX+"px";
                customCursor.style.top = e.clientY+"px";
            }
            if (isDrawing && (currentTool==="pencil"||currentTool==="eraser")) drawFreehand(e);
        });
        canvas.addEventListener("mouseup", stopDrawing);
        canvas.addEventListener("touchstart", e => { e.preventDefault(); startDrawing(e); });
        canvas.addEventListener("touchmove", e => { e.preventDefault(); drawFreehand(e); });
        canvas.addEventListener("touchend", e => { e.preventDefault(); stopDrawing(e); });

        // Инициализация
        window.addEventListener("load", () => {
            // Согласие
            if (!sessionStorage.getItem("consentBannerClosed")) {
                document.getElementById("dataConsentBanner").style.display = "flex";
                document.getElementById("consentButton").addEventListener("click", () => {
                    sessionStorage.setItem("consentBannerClosed","true");
                    document.getElementById("dataConsentBanner").style.display = "none";
                });
            }

            const verText = document.getElementById("versionText");
            const beta = document.getElementById("betaText");
            const switchContainer = document.getElementById("versionSwitchContainer");
            const settingsBtn = document.getElementById("settingsBtn");
            const stableExportImport = document.getElementById("stableExportImport");
            const darkThemeCheckbox = document.getElementById("darkThemeCheckbox");

            if (isDevVersion) {
                // Dev-режим
                verText.textContent = "HTMPen 9.0 ";
                beta.textContent = "beta!";
                beta.classList.remove("hidden");
                switchContainer.innerHTML = '<button id="switchToStableBtn" class="btn btn-stable-switch">Стабильная версия</button>';
                document.getElementById("switchToStableBtn").addEventListener("click", () => {
                    document.getElementById("versionSwitchTitle").textContent = "Возврат в стабильную";
                    document.getElementById("versionSwitchMessage").textContent = "Стабильная версия надёжнее.";
                    document.getElementById("confirmSwitchBtn").textContent = "Перейти";
                    document.getElementById("confirmSwitchBtn").style.background = "#3b82f6";
                    document.getElementById("versionSwitchModal").classList.add("show");
                    document.getElementById("confirmSwitchBtn").onclick = () => location.href = location.pathname;
                });

                // Включаем dev-фичи
                devToolsContainer.style.display = "block";
                layersContainer.style.display = "block";
                advancedColorContainer.style.display = "flex";
                settingsBtn.style.display = "block";
                stableExportImport.style.display = "none";
                // Кнопки сохранения
                saveContainer.innerHTML = `
                    <button id="savePngBtn" class="btn btn-save">PNG</button>
                    <button id="saveJpgBtn" class="btn btn-save">JPG</button>
                    <button id="saveWebpBtn" class="btn btn-save">WebP</button>
                `;
                document.getElementById("savePngBtn").addEventListener("click", () => downloadCanvas("png"));
                document.getElementById("saveJpgBtn").addEventListener("click", () => downloadCanvas("jpg"));
                document.getElementById("saveWebpBtn").addEventListener("click", () => downloadCanvas("webp"));

                // Слои
                renderLayers();
                addLayerBtn.addEventListener("click", () => {
                    layers.push({ name: `Слой ${layers.length+1}` });
                    activeLayer = layers.length-1;
                    renderLayers();
                });
                // Цвет
                document.getElementById("redInput").addEventListener("input", updateFromRGB);
                document.getElementById("greenInput").addEventListener("input", updateFromRGB);
                document.getElementById("blueInput").addEventListener("input", updateFromRGB);
                document.getElementById("hexInput").addEventListener("change", () => {
                    const v = document.getElementById("hexInput").value;
                    if (/^#[0-9a-fA-F]{6}$/.test(v)) { colorPicker.value = v; syncAdvColor(); setupContext(); }
                });
                colorPicker.addEventListener("input", syncAdvColor);
                syncAdvColor();
                // Тёмная тема из localStorage
                if (localStorage.getItem("darkTheme") === "true") {
                    document.documentElement.setAttribute("data-theme", "dark");
                    darkThemeCheckbox.checked = true;
                }
                darkThemeCheckbox.addEventListener("change", e => {
                    if (e.target.checked) {
                        document.documentElement.setAttribute("data-theme", "dark");
                        localStorage.setItem("darkTheme", "true");
                    } else {
                        document.documentElement.removeAttribute("data-theme");
                        localStorage.setItem("darkTheme", "false");
                    }
                });
                // Настройки (экспорт/импорт)
                settingsBtn.addEventListener("click", () => {
                    document.getElementById("settingsModal").classList.add("show");
                });
                document.getElementById("exportDataBtn").addEventListener("click", exportData);
                document.getElementById("importDataInput").addEventListener("change", e => {
                    if (e.target.files[0]) importData(e.target.files[0]);
                    e.target.value = "";
                });
                // AI отключён
                document.getElementById("geminiIdeaButton").addEventListener("click", e => {
                    e.preventDefault(); showNotification("AI отключён в dev‑версии");
                });
                document.getElementById("ideaListContainer").innerHTML = '<p class="text-center p-4">Недоступно в dev‑версии</p>';
                document.getElementById("clearLibraryButton").style.display = "none";
                // Dev-инструменты
                fillTool.addEventListener("click", () => activateTool("fill"));
                sprayTool.addEventListener("click", () => activateTool("spray"));
                textTool.addEventListener("click", () => activateTool("text"));
            } else {
                // Stable-режим (как оригинал)
                verText.textContent = "HTMPen 8, ПРОЕКТ ЗАБРОШЕН";
                beta.classList.add("hidden");
                switchContainer.innerHTML = '<button id="switchToDevBtn" class="btn btn-dev-switch">Dev‑версия</button>';
                document.getElementById("switchToDevBtn").addEventListener("click", () => {
                    document.getElementById("versionSwitchTitle").textContent = "Переход в Dev‑версию";
                    document.getElementById("versionSwitchMessage").textContent = "Новые функции, возможны ошибки.";
                    document.getElementById("confirmSwitchBtn").textContent = "Да, перейти";
                    document.getElementById("confirmSwitchBtn").style.background = "#f97316";
                    document.getElementById("versionSwitchModal").classList.add("show");
                    document.getElementById("confirmSwitchBtn").onclick = () => location.href = location.pathname + "?env=dev";
                });

                // Stable: экспорт/импорт на месте
                document.getElementById("exportDataBtnStable").addEventListener("click", exportData);
                document.getElementById("importDataInputStable").addEventListener("change", e => {
                    if (e.target.files[0]) importData(e.target.files[0]);
                    e.target.value = "";
                });
                // Stable AI
                document.getElementById("geminiIdeaButton").addEventListener("click", () => {
                    document.getElementById("geminiPrompt").innerHTML = "";
                    document.getElementById("geminiModal").classList.add("show");
                });
                renderIdeaLibrary();
                // Stable save PNG
                document.getElementById("saveButton").addEventListener("click", () => {
                    const tmp = document.createElement("canvas");
                    tmp.width = canvas.width; tmp.height = canvas.height;
                    const tctx = tmp.getContext("2d");
                    tctx.fillStyle = CANVAS_BG; tctx.fillRect(0,0,tmp.width,tmp.height);
                    tctx.drawImage(canvas,0,0);
                    const a = document.createElement("a");
                    a.download = "drawing.png"; a.href = tmp.toDataURL(); a.click();
                });
            }

            // Общие обработчики
            document.getElementById("cancelSwitchBtn").addEventListener("click", () => {
                document.getElementById("versionSwitchModal").classList.remove("show");
            });
            document.getElementById("settingsModalClose").addEventListener("click", () => {
                document.getElementById("settingsModal").classList.remove("show");
            });

            showScreen("galleryScreen");
            activateTool("pencil");
            document.getElementById("clearButton").addEventListener("click", () => ctx.clearRect(0,0,canvas.width,canvas.height));
            document.getElementById("newDrawingBtn").addEventListener("click", () => {
                currentDrawingId = Date.now();
                showScreen("drawingScreen");
                setTimeout(() => ctx.clearRect(0,0,canvas.width,canvas.height), 0);
            });
            document.getElementById("backToGalleryBtn").addEventListener("click", () => {
                saveCurrentDrawing();
                showScreen("galleryScreen");
            });
            window.addEventListener("resize", resizeCanvas);
            Object.keys(toolButtons).forEach(name => {
                toolButtons[name].addEventListener("click", () => activateTool(name));
            });
            lineWidth.addEventListener("input", e => {
                lineWidthValue.textContent = e.target.value;
                customCursor.style.width = `${e.target.value}px`;
                customCursor.style.height = `${e.target.value}px`;
                setupContext();
            });
        });

        // Библиотека идей (stable)
        function renderIdeaLibrary() {
            const ideas = JSON.parse(localStorage.getItem(ideasKey) || "[]");
            const cont = document.getElementById("ideaListContainer");
            cont.innerHTML = "";
            if (!ideas.length) {
                cont.innerHTML = '<p class="text-center p-4">Пусто</p>';
                document.getElementById("clearLibraryButton").style.display = "none";
                return;
            }
            ideas.forEach(idea => {
                const el = document.createElement("div");
                el.className = "idea-item";
                el.innerHTML = `<span>${idea}</span><button class="copy-idea-btn"><svg width="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 01-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 0 011.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 0 00-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 01-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 00-3.375-3.375h-1.5a1.125 1.125 0 01-1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H9.75"/></svg></button>`;
                el.querySelector(".copy-idea-btn").addEventListener("click", () => navigator.clipboard.writeText(idea));
                cont.appendChild(el);
            });
            document.getElementById("clearLibraryButton").style.display = "block";
        }
        document.getElementById("clearLibraryButton").addEventListener("click", () => {
            localStorage.removeItem(ideasKey);
            renderIdeaLibrary();
        });

        async function getIdea(mood) {
            const promptCont = document.getElementById("geminiPrompt");
            promptCont.innerHTML = '<div class="loader"></div>';
            const prompts = {
                funny: "Смешная идея для рисунка на русском (коротко).",
                serious: "Эпичная идея для рисунка на русском (коротко).",
            };
            const prompt = mood === "funny" || mood === "serious" ? prompts[mood] : `Идея для рисунка на русском, настроение: ${mood}`;
            const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=NO`, {
                method: "POST",
                headers: {"Content-Type":"application/json"},
                body: JSON.stringify({contents:[{parts:[{text:prompt}]}]})
            }).catch(() => {});
            if (!resp || !resp.ok) {
                promptCont.textContent = "Ошибка или ключ отсутствует.";
                return;
            }
            const data = await resp.json();
            const text = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || "Нет ответа";
            promptCont.textContent = text;
            const ideas = JSON.parse(localStorage.getItem(ideasKey) || "[]");
            ideas.unshift(text);
            if (ideas.length > 15) ideas.pop();
            localStorage.setItem(ideasKey, JSON.stringify(ideas));
            renderIdeaLibrary();
        }
        document.getElementById("funnyIdeaBtn").addEventListener("click", () => getIdea("funny"));
        document.getElementById("seriousIdeaBtn").addEventListener("click", () => getIdea("serious"));
        document.getElementById("customIdeaBtn").addEventListener("click", () => getIdea(document.getElementById("customMoodInput").value));
        document.querySelector("#geminiModal .modal-close").addEventListener("click", () => document.getElementById("geminiModal").classList.remove("show"));
    </script>
</body>
</html>
