<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>VSKY SPOTLIGHT</title>

    <link rel="icon" type="image/png" href="https://file.garden/aUk_YK3Gbmwc6_an/KnightHead.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --dr-bg: #000000;
            --dr-grid-front: rgba(180, 0, 255, 0.5);
            --dr-grid-back: rgba(180, 0, 255, 0.15);
            
            --dr-text: #ffffff;
            --dr-border: #ffffff;
            
            --dr-pink: #ff00ff;
            --dr-cyan: #00ffff;
            --dr-yellow: #ffff00;
            --dr-red: #ff0000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        @keyframes gridMoveFront {
            0% { background-position: 0 0; }
            100% { background-position: -40px -40px; }
        }
        
        @keyframes gridMoveBack {
            0% { background-position: 0 0; }
            100% { background-position: 30px -30px; }
        }

        body {
            background-color: var(--dr-bg);
            background-image: 
                linear-gradient(var(--dr-grid-front) 2px, transparent 2px),
                linear-gradient(90deg, var(--dr-grid-front) 2px, transparent 2px);
            background-size: 40px 40px;
            animation: gridMoveFront 1.5s linear infinite;
            position: relative;
            
            color: var(--dr-text);
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.15rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        body::before {
            content: "";
            position: fixed;
            top: -50px; left: -50px; right: -50px; bottom: -50px;
            z-index: -1;
            background-image: 
                linear-gradient(var(--dr-grid-back) 2px, transparent 2px),
                linear-gradient(90deg, var(--dr-grid-back) 2px, transparent 2px);
            background-size: 30px 30px;
            animation: gridMoveBack 2.5s linear infinite;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
        }

        .dr-box {
            background-color: #000;
            border: 4px solid var(--dr-border);
            padding: 20px;
            box-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
        }

        h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.8rem;
            color: var(--dr-text);
            line-height: 1.5;
            text-shadow: 2px 2px 0px var(--dr-pink);
        }

        .nav-link {
            font-family: 'Press Start 2P', cursive;
            font-size: 1rem;
            color: var(--dr-text);
            text-decoration: none;
            background-color: #000;
            border: 2px solid var(--dr-border);
            padding: 10px;
            transition: 0.1s;
        }
        
        .nav-link:hover {
            border-color: var(--dr-cyan);
            color: var(--dr-cyan);
            box-shadow: 0 0 10px var(--dr-cyan);
        }

        .branch-selector {
            display: flex;
            gap: 15px;
        }

        .branch-btn {
            flex: 1;
            background: #000;
            border: 4px solid #555;
            color: #aaa;
            font-family: 'Press Start 2P', cursive;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 15px;
            transition: 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .soul-icon {
            width: 18px;
            height: auto;
            display: none; 
            image-rendering: pixelated;
        }

        .branch-btn#btn-raylit.active {
            border-color: var(--dr-red);
            color: var(--dr-text);
            box-shadow: inset 0 0 10px rgba(255,0,0,0.5), 0 0 10px rgba(255,0,0,0.5);
        }
        .branch-btn#btn-raylit.active .soul-icon { display: block; }

        .branch-btn#btn-solar.active {
            border-color: var(--dr-yellow);
            color: var(--dr-text);
            box-shadow: inset 0 0 10px rgba(255,255,0,0.3), 0 0 10px rgba(255,255,0,0.3);
        }
        .branch-btn#btn-solar.active .soul-icon { display: block; }

        .branch-btn:hover:not(.active) {
            border-color: var(--dr-text);
            color: var(--dr-text);
        }

        .main-grid {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            align-items: start;
        }

        @media (max-width: 768px) {
            .main-grid { grid-template-columns: 1fr; }
            .header { flex-direction: column; text-align: center; gap: 15px; }
            .branch-selector { flex-direction: column; gap: 10px; }
        }

        .panel-title {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.2rem;
            color: var(--dr-cyan);
            margin-bottom: 15px;
            border-bottom: 2px dashed #555;
            padding-bottom: 10px;
        }

        input[type="text"], input[type="password"], textarea {
            background: #111;
            border: 2px solid #555;
            color: var(--dr-text);
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1rem;
            padding: 10px;
            width: 100%;
            outline: none;
            margin-bottom: 15px;
            transition: 0.1s;
        }

        input:focus, textarea:focus {
            border-color: var(--dr-cyan);
            box-shadow: inset 0 0 5px rgba(0, 255, 255, 0.3);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button.act-btn {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.9rem;
            color: var(--dr-text);
            background: #000;
            border: 2px solid var(--dr-border);
            padding: 12px;
            cursor: pointer;
            width: 100%;
            transition: 0.1s;
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        button.act-btn:hover {
            border-color: var(--dr-cyan);
            color: var(--dr-cyan);
            box-shadow: inset 0 0 10px rgba(0,255,255,0.2);
        }

        button.act-btn.danger:hover {
            border-color: var(--dr-red);
            color: var(--dr-red);
            box-shadow: inset 0 0 10px rgba(255,0,0,0.2);
        }

        button.act-btn:hover .btn-soul { display: block; }
        .btn-soul { width: 14px; height: auto; display: none; image-rendering: pixelated; }

        .file-upload-btn {
            display: block;
            text-align: center;
            background: #000;
            border: 2px dashed #555;
            color: #aaa;
            padding: 10px;
            cursor: pointer;
            font-family: 'Share Tech Mono', monospace;
            margin-bottom: 15px;
            transition: 0.1s;
        }

        .file-upload-btn:hover { 
            border-color: var(--dr-pink);
            color: var(--dr-pink);
        }

        #image-preview {
            max-width: 100%;
            margin-bottom: 15px;
            border: 2px solid var(--dr-cyan);
            display: none;
        }

        .sys-msg { font-size: 0.95rem; min-height: 20px; margin-top: 5px; font-weight: bold; }
        .msg-error { color: var(--dr-red); }
        .msg-success { color: #00ff00; }

        .feed {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .post-card {
            background-color: #000;
            border: 4px solid var(--dr-border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            color: var(--dr-text);
            box-shadow: 0 0 10px rgba(255,255,255,0.1);
        }

        .post-card.admin-post {
            border-color: #888;
        }

        .post-card.system-post {
            border-color: var(--dr-pink);
            box-shadow: 0 0 15px rgba(255,0,255,0.2);
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed #555;
            padding-bottom: 8px;
        }

        .system-post .post-header {
            border-bottom-color: rgba(255,0,255,0.4);
        }

        .post-author {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.1rem;
        }

        .admin-post .post-author { color: var(--dr-text); }
        .system-post .post-author { color: var(--dr-pink); }
        
        .dev-badge {
            color: var(--dr-bg);
            background: var(--dr-cyan);
            padding: 2px 6px;
            font-size: 0.8rem;
            margin-left: 10px;
            vertical-align: top;
        }

        .post-time { 
            font-size: 1rem; 
            color: #888; 
            margin-left: 15px;
        }

        .post-content {
            font-size: 1.25rem;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .post-img {
            max-width: 100%;
            border: 2px solid var(--dr-border);
            margin-top: 5px;
        }
        
        .delete-btn {
            background: transparent;
            border: none;
            color: var(--dr-red);
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
            font-size: 1.2rem;
            transition: 0.1s;
        }
        .delete-btn:hover { transform: scale(1.2); text-shadow: 0 0 5px red; }

        .replies-section {
            margin-top: 10px;
            border-top: 2px solid #333;
            padding-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .reply-card {
            border-left: 3px solid #555;
            padding-left: 12px;
        }

        .reply-card.system-post {
            border-left-color: var(--dr-pink);
        }

        .reply-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            align-items: center;
        }

        .reply-form {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .reply-form input {
            margin-bottom: 0;
        }

        .reply-btn {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.8rem;
            background: #000;
            color: var(--dr-text);
            border: 2px solid #555;
            padding: 0 15px;
            cursor: pointer;
            transition: 0.1s;
        }

        .reply-btn:hover {
            border-color: var(--dr-cyan);
            color: var(--dr-cyan);
        }
        
        @keyframes pulseSoul {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        .loading-soul {
            width: 30px;
            height: auto;
            animation: pulseSoul 1s infinite;
            display: block;
            margin: 0 auto;
            image-rendering: pixelated;
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="header dr-box">
            <div>
                <h1 style="font-family: 'Share Tech Mono', monospace; font-size: 1rem; color: var(--dr-cyan); text-shadow: none; margin-bottom: 5px;">[ CYBER TERMINAL ]</h1>
                <h1>VSKY SPOTLIGHT</h1>
            </div>
            <a href="index.html" class="nav-link">&lt; ВЕРНУТЬСЯ</a>
        </header>

        <div class="branch-selector">
            <button id="btn-raylit" class="branch-btn active" onclick="switchBranch('raylit_posts')">
                <img class="soul-icon" src="https://deltarune.wiki/images/SOUL_battle.png?cb=kvtrdg&h=thumb.php&f=SOUL_battle.png" alt="Soul">
                VSKY
            </button>
            <button id="btn-solar" class="branch-btn" onclick="switchBranch('solar_posts')">
                <img class="soul-icon" src="https://deltarune.wiki/images/SOUL_battle.png?cb=kvtrdg&h=thumb.php&f=SOUL_battle.png" alt="Soul">
                SOLAR
            </button>
        </div>

        <main class="main-grid">
            <aside>
                <div id="login-section" class="dr-box">
                    <div class="panel-title">АВТОРИЗАЦИЯ</div>
                    <div><input type="text" id="login-username" placeholder="ИМЯ ПОЛЬЗОВАТЕЛЯ"></div>
                    <div><input type="password" id="login-pin" placeholder="ПИН-КОД"></div>
                    <button class="act-btn" onclick="attemptLogin()">
                        <img class="btn-soul" src="https://deltarune.wiki/images/SOUL_battle.png?cb=kvtrdg&h=thumb.php&f=SOUL_battle.png" alt="Soul">
                        ВОЙТИ
                    </button>
                    <div id="login-sys-msg" class="sys-msg"></div>
                </div>

                <div id="post-section" class="dr-box" style="display: none;">
                    <div class="panel-title">СВЯЗЬ</div>
                    <div style="font-family: 'Share Tech Mono', monospace; font-size: 1rem; color: #aaa; margin-bottom: 15px;">
                        ОПЕРАТОР: <span id="current-user-display" style="color: var(--dr-cyan);"></span>
                    </div>
                    <textarea id="post-text" placeholder="* Введите сообщение..."></textarea>
                    
                    <div>
                        <label for="post-image-input" class="file-upload-btn">ПРИКРЕПИТЬ ИЗОБРАЖЕНИЕ</label>
                        <input type="file" id="post-image-input" accept="image/*" style="display: none;" onchange="handleImageSelect(event)">
                        <img id="image-preview" src="" alt="Preview">
                    </div>

                    <div id="system-post-toggle" style="display: none; margin-bottom: 15px; background: rgba(255,0,255,0.1); padding: 10px; border: 1px solid var(--dr-pink);">
                        <label style="color: var(--dr-pink); font-family: 'Share Tech Mono', monospace; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; gap: 8px;">
                            <input type="checkbox" id="is-system-post" style="width: 20px; height: 20px; margin: 0; accent-color: var(--dr-pink);">
                            СИСТЕМНОЕ УВЕДОМЛЕНИЕ
                        </label>
                    </div>

                    <button class="act-btn" onclick="submitPost()">
                        <img class="btn-soul" src="https://deltarune.wiki/images/SOUL_battle.png?cb=kvtrdg&h=thumb.php&f=SOUL_battle.png" alt="Soul">
                        [ ОТПРАВИТЬ ]
                    </button>
                    <button class="act-btn danger" onclick="logout()">[ ОТКЛЮЧИТЬСЯ ]</button>
                    <div id="post-sys-msg" class="sys-msg"></div>
                </div>
            </aside>

            <section class="feed" id="feed-container">
            </section>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAlGXzpw-cDNH7BScmIO4rjumj4Q8_sQKQ",
            authDomain: "gwwraylitspotlight.firebaseapp.com",
            projectId: "gwwraylitspotlight",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app); 
        const db = getFirestore(app);
        
        const VALID_USERS = {
            "DrGnusin": "3357",
            "mamanya": "120999",
            "Hjort": "8982"
        };
        
        let posts = [];
        let currentBranch = 'raylit_posts'; 
        let unsubscribeSnapshot = null; 
        let currentImageBase64 = null; 

        function showLoadingUI(text, isError = false) {
            const container = document.getElementById('feed-container');
            if (isError) {
                container.innerHTML = `
                    <div class="dr-box" style="border-color: red;">
                        <div class="post-content msg-error">* ${text}</div>
                    </div>`;
                return;
            }
            container.innerHTML = `
                <div class="dr-box" style="text-align: center; display:flex; flex-direction:column; gap:15px; align-items:center;">
                    <img src="https://deltarune.wiki/images/SOUL_battle.png?cb=kvtrdg&h=thumb.php&f=SOUL_battle.png" class="loading-soul" alt="Soul">
                    <div style="font-family: 'Press Start 2P', cursive; font-size: 1.2rem; color: white; line-height: 1.5;">* ${text}</div>
                </div>`;
        }

        function formatTimestamp(ts) {
            if (!ts) return "??.??.????";
            const date = new Date(ts);
            const pad = (n) => n.toString().padStart(2, '0');
            return `${pad(date.getDate())}.${pad(date.getMonth() + 1)}.${date.getFullYear()} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
        }

        function showMessage(elementId, text, isError = false) {
            const el = document.getElementById(elementId);
            el.innerText = text;
            el.className = `sys-msg ${isError ? 'msg-error' : 'msg-success'}`;
            setTimeout(() => { el.innerText = ''; }, 3000);
        }

        window.handleImageSelect = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    const MAX_HEIGHT = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    currentImageBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    
                    const preview = document.getElementById('image-preview');
                    preview.src = currentImageBase64;
                    preview.style.display = 'block';
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function resetImageUpload() {
            currentImageBase64 = null;
            document.getElementById('post-image-input').value = '';
            const preview = document.getElementById('image-preview');
            preview.src = '';
            preview.style.display = 'none';
        }

        function renderPosts() {
            const container = document.getElementById('feed-container');
            container.innerHTML = '';

            if (posts.length === 0) {
                container.innerHTML = '<div class="dr-box"><div class="post-content" style="color:#888;">* Здесь пока пусто...</div></div>';
                return;
            }

            const currentUser = sessionStorage.getItem('gww_user');
            const isLoggedIn = !!currentUser;

            posts.forEach(post => {
                let cardClass = '';
                if (post.author === 'АДМИНИСТРАТОР') {
                    cardClass = 'system-post';
                } else if (VALID_USERS.hasOwnProperty(post.author)) {
                    cardClass = 'admin-post';
                }

                const card = document.createElement('div');
                card.className = `post-card ${cardClass}`;
                
                const safeText = post.text ? post.text.replace(/</g, "&lt;").replace(/>/g, "&gt;") : "";
                const displayDesc = safeText.startsWith('*') ? safeText : `* ${safeText}`;

                const imgHtml = post.image ? `<img src="${post.image}" class="post-img" alt="Attached file">` : '';

                let deleteBtnHtml = '';
                if (isLoggedIn) {
                    deleteBtnHtml = `<button class="delete-btn" onclick="deletePost('${post.id}')" title="Удалить">✖</button>`;
                }

                let displayAuthor = post.author || "UNKNOWN";
                if (displayAuthor === 'DrGnusin') {
                    displayAuthor = 'DrGnusin <span class="dev-badge">DEV</span>';
                }

                let repliesHtml = '';
                const replies = post.replies || [];

                if (replies.length > 0 || isLoggedIn) {
                    repliesHtml += '<div class="replies-section">';
                    
                    if (replies.length > 0) {
                        replies.forEach(reply => {
                            let rAuthor = reply.author || 'АНОНИМ';
                            if (rAuthor === 'DrGnusin') {
                                rAuthor = 'DrGnusin <span class="dev-badge" style="font-size: 0.6rem; padding: 2px 4px;">DEV</span>';
                            }
                            let rClass = reply.author === 'АДМИНИСТРАТОР' ? 'system-post' : '';
                            const safeReplyText = reply.text ? reply.text.replace(/</g, "&lt;").replace(/>/g, "&gt;") : "";
                            const dispReply = safeReplyText.startsWith('*') ? safeReplyText : `* ${safeReplyText}`;
                            
                            let replyDeleteBtnHtml = '';
                            if (isLoggedIn) {
                                const replyId = reply.id || reply.timestamp;
                                replyDeleteBtnHtml = `<button class="delete-btn" style="font-size: 1rem;" onclick="deleteReply('${post.id}', '${replyId}')" title="Удалить">✖</button>`;
                            }

                            repliesHtml += `
                                <div class="reply-card ${rClass}">
                                    <div class="reply-header">
                                        <div>
                                            <span class="post-author" style="font-size: 0.9rem;">${rAuthor}</span>
                                            <span class="post-time" style="font-size: 0.9rem;">${formatTimestamp(reply.timestamp)}</span>
                                        </div>
                                        ${replyDeleteBtnHtml}
                                    </div>
                                    <div class="post-content" style="font-size: 1.1rem;">${dispReply}</div>
                                </div>
                            `;
                        });
                    }
                    
                    if (isLoggedIn) {
                        repliesHtml += `
                            <div class="reply-form">
                                <input type="text" id="reply-input-${post.id}" placeholder="* Комментарий...">
                                <button class="reply-btn" onclick="submitReply('${post.id}')">ОТВЕТИТЬ</button>
                            </div>
                        `;
                    }
                    repliesHtml += '</div>';
                }

                card.innerHTML = `
                    <div class="post-header">
                        <div>
                            <span class="post-author">${displayAuthor}</span>
                            <span class="post-time">${formatTimestamp(post.timestamp)}</span>
                        </div>
                        ${deleteBtnHtml}
                    </div>
                    <div class="post-content">${displayDesc}</div>
                    ${imgHtml}
                    ${repliesHtml}
                `;
                container.appendChild(card);
            });
        }

        window.switchBranch = function(branchName) {
            currentBranch = branchName;
            
            document.getElementById('btn-raylit').classList.remove('active');
            document.getElementById('btn-solar').classList.remove('active');
            
            if (branchName === 'raylit_posts') document.getElementById('btn-raylit').classList.add('active');
            if (branchName === 'solar_posts') document.getElementById('btn-solar').classList.add('active');
            
            showLoadingUI("Загрузка файлов Тёмного Мира...");
            listenToDatabase();
        }

        function checkSession() {
            const currentUser = sessionStorage.getItem('gww_user');
            
            if (currentUser) {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('post-section').style.display = 'block';
                
                let displayName = currentUser;
                if (currentUser === 'DrGnusin') displayName = 'DrGnusin (ADMIN)';
                document.getElementById('current-user-display').innerText = displayName;

                const sysToggle = document.getElementById('system-post-toggle');
                if (sysToggle) {
                    if (currentUser === 'DrGnusin') sysToggle.style.display = 'block';
                    else {
                        sysToggle.style.display = 'none';
                        document.getElementById('is-system-post').checked = false;
                    }
                }
            } else {
                document.getElementById('login-section').style.display = 'block';
                document.getElementById('post-section').style.display = 'none';
            }
            renderPosts();
        }

        window.attemptLogin = function() {
            const user = document.getElementById('login-username').value;
            const pin = document.getElementById('login-pin').value;

            if (VALID_USERS[user] && VALID_USERS[user] === pin) {
                sessionStorage.setItem('gww_user', user);
                document.getElementById('login-username').value = '';
                document.getElementById('login-pin').value = '';
                checkSession();
            } else {
                showMessage('login-sys-msg', '* ОШИБКА ДОСТУПА', true);
            }
        }

        window.logout = function() {
            sessionStorage.removeItem('gww_user');
            checkSession();
        }

        window.submitPost = async function() {
            const textarea = document.getElementById('post-text');
            const text = textarea.value.trim();
            const currentUser = sessionStorage.getItem('gww_user');
            const isSystemCheck = document.getElementById('is-system-post');
            const isSystem = isSystemCheck ? isSystemCheck.checked : false;

            if (!text && !currentImageBase64) {
                showMessage('post-sys-msg', '* НИЧЕГО НЕ ВВЕДЕНО', true);
                return;
            }

            let authorName = currentUser;
            if (isSystem && currentUser === 'DrGnusin') {
                authorName = 'АДМИНИСТРАТОР';
            }

            const newPost = {
                author: authorName,
                text: text,
                timestamp: Date.now(),
                replies: []
            };
            if (currentImageBase64) newPost.image = currentImageBase64;

            try {
                if (!auth.currentUser) throw new Error("Нет соединения с ядром.");
                const postsCol = collection(db, currentBranch);
                await addDoc(postsCol, newPost);
                
                textarea.value = '';
                if (isSystemCheck) isSystemCheck.checked = false;
                resetImageUpload();
                showMessage('post-sys-msg', '* УСПЕШНО ОТПРАВЛЕНО', false);
            } catch (e) {
                console.error("Ошибка:", e);
                showMessage('post-sys-msg', '* ОШИБКА СЕТИ', true);
            }
        }

        window.deletePost = async function(postId) {
            try {
                if (!auth.currentUser) return;
                const docRef = doc(db, currentBranch, postId);
                await deleteDoc(docRef);
            } catch (e) { console.error("Ошибка удаления:", e); }
        }

        window.submitReply = async function(postId) {
            const input = document.getElementById(`reply-input-${postId}`);
            const text = input.value.trim();
            if (!text) return;

            const currentUser = sessionStorage.getItem('gww_user');
            const isSystemCheck = document.getElementById('is-system-post');
            const isSystem = isSystemCheck ? isSystemCheck.checked : false;
            
            let authorName = currentUser;
            if (isSystem && currentUser === 'DrGnusin') authorName = 'АДМИНИСТРАТОР';

            const newReply = {
                id: Date.now().toString() + Math.random().toString(36).substring(2, 8),
                author: authorName,
                text: text,
                timestamp: Date.now()
            };

            try {
                if (!auth.currentUser) return;
                const docRef = doc(db, currentBranch, postId);
                await updateDoc(docRef, { replies: arrayUnion(newReply) });
                input.value = '';
            } catch (e) { console.error("Ошибка ответа:", e); }
        }

        window.deleteReply = async function(postId, replyIdentifier) {
            try {
                if (!auth.currentUser) return;
                const post = posts.find(p => p.id === postId);
                if (!post || !post.replies) return;

                const updatedReplies = post.replies.filter(r => {
                    if (r.id) return r.id !== replyIdentifier;
                    return r.timestamp.toString() !== replyIdentifier.toString();
                });

                const docRef = doc(db, currentBranch, postId);
                await updateDoc(docRef, { replies: updatedReplies });
            } catch (e) { console.error("Ошибка удаления:", e); }
        }

        function listenToDatabase() {
            if (!auth.currentUser) return; 
            if (unsubscribeSnapshot) unsubscribeSnapshot();

            const postsCol = collection(db, currentBranch);
            
            showLoadingUI("Загрузка постов...");
            
            unsubscribeSnapshot = onSnapshot(postsCol, (snapshot) => {
                posts = [];
                snapshot.forEach((doc) => {
                    posts.push({ id: doc.id, ...doc.data() });
                });
                
                posts.sort((a, b) => b.timestamp - a.timestamp);
                renderPosts();
            }, (error) => {
                showLoadingUI(`СБОЙ: ${error.message}<br><br>Включи анонимный вход в Firebase!`, true);
            });
        }

        showLoadingUI("Установка защищенного соединения...");

        onAuthStateChanged(auth, (user) => {
            if (user) {
                listenToDatabase();
            } else {
                signInAnonymously(auth).catch((error) => {
                    showLoadingUI(`ОШИБКА АВТОРИЗАЦИИ: ${error.message}<br>Зайди в Firebase -> Authentication и включи Anonymous.`, true);
                });
            }
        });

        checkSession();

        document.getElementById('login-pin').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') window.attemptLogin();
        });
    </script>
</body>
</html>
