<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Team Raylit Spotlight</title>
    <!-- Пиксельные шрифты с поддержкой кириллицы -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --dr-bg: #020208;
            --dr-grid: #800080;
            --dr-text: #ffffff;
            --dr-border: #ffffff;
            --dr-green: #00ff00;
            --dr-pink: #ff00ff;
            --dr-cyan: #00ffff;
            --dr-yellow: #ffff00;
            --dr-red: #ff0000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--dr-bg);
            background-image: 
                linear-gradient(var(--dr-grid) 2px, transparent 2px),
                linear-gradient(90deg, var(--dr-grid) 2px, transparent 2px);
            background-size: 50px 50px;
            animation: scrollGrid 3s linear infinite;
            color: var(--dr-text);
            font-family: 'Pixelify Sans', sans-serif;
            font-size: 1.2rem;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        @keyframes scrollGrid {
            0% { background-position: 0px 0px; }
            100% { background-position: -50px 50px; }
        }

        .container {
            width: 100%;
            max-width: 1000px;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .dr-box {
            background-color: #000;
            border: 4px solid var(--dr-border);
            border-radius: 8px;
            padding: 20px;
            box-shadow: inset 0 0 0 2px #000, 0 0 10px rgba(128, 0, 128, 0.4);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-family: 'Press Start 2P', monospace;
            font-size: 1.8rem;
            color: var(--dr-text);
            text-transform: uppercase;
            text-shadow: 3px 3px 0px var(--dr-pink);
        }

        .nav-link {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.8rem;
            color: var(--dr-cyan);
            text-decoration: none;
            transition: 0.2s;
        }
        
        .nav-link:hover {
            color: var(--dr-yellow);
        }

        .branch-selector {
            display: flex;
            gap: 15px;
            padding: 15px;
        }

        .branch-btn {
            background: transparent;
            border: none;
            color: var(--dr-text);
            font-family: 'Press Start 2P', monospace;
            font-size: 0.9rem;
            cursor: pointer;
            padding: 10px 10px 10px 30px;
            position: relative;
            transition: 0.2s;
        }

        .branch-btn::before {
            content: '';
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><path fill="%23ff0000" d="M8,15 L1,8 L1,3 L4,0 L7,0 L8,2 L9,0 L12,0 L15,3 L15,8 Z"/></svg>');
            background-size: contain;
            background-repeat: no-repeat;
            width: 16px;
            height: 16px;
            position: absolute;
            left: 5px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0;
            transition: 0.1s;
        }

        .branch-btn:hover, .branch-btn.active {
            color: var(--dr-yellow);
        }

        .branch-btn.active::before {
            opacity: 1;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            align-items: start;
        }

        @media (max-width: 768px) {
            .main-grid { grid-template-columns: 1fr; }
            .header { flex-direction: column; gap: 15px; align-items: flex-start; }
        }

        .panel-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 1rem;
            color: var(--dr-yellow);
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        input, textarea {
            background: #000;
            border: 2px solid var(--dr-border);
            border-radius: 4px;
            color: var(--dr-text);
            font-family: 'Pixelify Sans', sans-serif;
            font-size: 1.2rem;
            padding: 10px;
            width: 100%;
            outline: none;
            transition: 0.2s;
            margin-bottom: 10px;
        }

        input:focus, textarea:focus {
            border-color: var(--dr-cyan);
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.4);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        button.act-btn {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.8rem;
            color: var(--dr-yellow);
            background: #000;
            border: 2px solid var(--dr-yellow);
            border-radius: 4px;
            padding: 10px;
            cursor: pointer;
            text-transform: uppercase;
            width: 100%;
            transition: 0.2s;
            margin-top: 5px;
        }

        button.act-btn:hover {
            background: var(--dr-yellow);
            color: #000;
        }

        button.act-btn.danger {
            color: var(--dr-pink);
            border-color: var(--dr-pink);
        }

        button.act-btn.danger:hover {
            background: var(--dr-pink);
            color: #000;
        }

        .file-upload-btn {
            display: block;
            text-align: center;
            border: 2px dashed var(--dr-cyan);
            color: var(--dr-cyan);
            padding: 10px;
            cursor: pointer;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.7rem;
            margin-bottom: 10px;
            border-radius: 4px;
        }

        .file-upload-btn:hover { background: rgba(0, 255, 255, 0.1); }

        #image-preview {
            max-width: 100%;
            margin-bottom: 10px;
            border: 2px solid var(--dr-border);
            border-radius: 4px;
            display: none;
        }

        .sys-msg { font-size: 1rem; min-height: 20px; margin-top: 10px; }
        .msg-error { color: var(--dr-pink); animation: bob 1s infinite alternate; }
        .msg-success { color: var(--dr-green); }

        @keyframes bob {
            from { transform: translateY(0); }
            to { transform: translateY(3px); }
        }

        .feed {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .post-card {
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
        }

        .post-card.admin-post {
            border-color: var(--dr-yellow);
            box-shadow: inset 0 0 0 2px #000, 0 0 10px rgba(255, 255, 0, 0.2);
        }

        .post-card.system-post {
            border-color: var(--dr-pink);
            box-shadow: inset 0 0 0 2px #000, 0 0 15px rgba(255, 0, 255, 0.3);
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed #444;
            padding-bottom: 10px;
            margin-bottom: 5px;
        }

        .post-author {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.9rem;
            color: var(--dr-text);
        }

        .admin-post .post-author { color: var(--dr-yellow); }
        .system-post .post-author { color: var(--dr-pink); text-shadow: 2px 2px 0px #000; }
        .post-time { font-size: 0.9rem; opacity: 0.6; }

        .post-content {
            font-size: 1.4rem;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .post-img {
            max-width: 100%;
            border: 2px solid var(--dr-border);
            border-radius: 4px;
            margin-top: 10px;
        }
        
        .delete-btn {
            background: transparent;
            border: none;
            color: var(--dr-pink);
            cursor: pointer;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.8rem;
            transition: 0.2s;
        }

        .delete-btn:hover { color: #fff; transform: scale(1.2); }

        .replies-section {
            margin-top: 15px;
            border-top: 2px solid #444;
            padding-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .reply-card {
            background: rgba(255,255,255,0.05);
            border-left: 4px solid var(--dr-cyan);
            padding: 10px 15px;
            border-radius: 4px;
        }

        .reply-card.system-post {
            border-left-color: var(--dr-pink);
            background: rgba(255, 0, 255, 0.05);
        }

        .reply-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-bottom: 8px;
        }

        .reply-form {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            align-items: center;
        }

        .reply-form input {
            margin-bottom: 0;
            padding: 8px;
            font-size: 1rem;
        }

        .reply-btn {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.6rem;
            background: transparent;
            color: var(--dr-cyan);
            border: 2px solid var(--dr-cyan);
            padding: 10px;
            cursor: pointer;
            border-radius: 4px;
        }

        .reply-btn:hover {
            background: var(--dr-cyan);
            color: #000;
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="dr-box header">
            <h1>TEAM RAYLIT SPOTLIGHT</h1>
            <a href="index.html" class="nav-link">[ ВЕРНУТЬСЯ ]</a>
        </header>

        <div class="dr-box branch-selector">
            <button id="btn-raylit" class="branch-btn active" onclick="switchBranch('raylit_posts')">SPOTLIGHT: RAYLIT</button>
            <button id="btn-solar" class="branch-btn" onclick="switchBranch('solar_posts')">SPOTLIGHT: SOLAR</button>
        </div>

        <main class="main-grid">
            <aside>
                <div id="login-section" class="dr-box">
                    <div class="panel-title">ВХОД</div>
                    <div><input type="text" id="login-username" placeholder="ИМЯ ПОЛЬЗОВАТЕЛЯ"></div>
                    <div><input type="password" id="login-pin" placeholder="PIN КОД"></div>
                    <button class="act-btn" onclick="attemptLogin()">[ ВОЙТИ ]</button>
                    <div id="login-sys-msg" class="sys-msg"></div>
                </div>

                <div id="post-section" class="dr-box" style="display: none;">
                    <div class="panel-title">ЗАПИСЬ</div>
                    <div style="font-family: 'Press Start 2P', monospace; font-size: 0.7rem; color: var(--dr-text); margin-bottom: 15px;">
                        ВЫ: <span id="current-user-display" style="color: var(--dr-yellow);"></span>
                    </div>
                    <textarea id="post-text" placeholder="Введите текст..."></textarea>
                    
                    <div>
                        <label for="post-image-input" class="file-upload-btn">[ ВЛОЖИТЬ ФАЙЛ ]</label>
                        <input type="file" id="post-image-input" accept="image/*" style="display: none;" onchange="handleImageSelect(event)">
                        <img id="image-preview" src="" alt="Preview">
                    </div>

                    <div id="system-post-toggle" style="display: none; margin-bottom: 15px;">
                        <label style="color: var(--dr-pink); font-family: 'Press Start 2P', monospace; font-size: 0.6rem; cursor: pointer; display: flex; align-items: center; gap: 8px;">
                            <input type="checkbox" id="is-system-post" style="width: auto; margin: 0;">
                            ОТ ЛИЦА СИСТЕМЫ
                        </label>
                    </div>

                    <button class="act-btn" onclick="submitPost()">[ СОХРАНИТЬ ]</button>
                    <button class="act-btn danger" onclick="logout()">[ ВЫЙТИ ]</button>
                    <div id="post-sys-msg" class="sys-msg"></div>
                </div>
            </aside>

            <section class="feed" id="feed-container">
                <!-- Контейнер для загрузки -->
            </section>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // РАТИБОР: Я вырезал проверку системных ключей. Теперь скрипт ЖЕЛЕЗНО 
        // использует твои ключи, никаких больше обманов и пустых баз!
        const firebaseConfig = {
            apiKey: "AIzaSyAlGXzpw-cDNH7BScmIO4rjumj4Q8_sQKQ",
            authDomain: "gwwraylitspotlight.firebaseapp.com",
            projectId: "gwwraylitspotlight",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app); 
        const db = getFirestore(app);
        
        const VALID_USERS = {
            "DrGnusin": "3357",
            "mamanya": "120999",
            "Hjort": "8982"
        };
        
        let posts = [];
        let currentBranch = 'raylit_posts'; 
        let unsubscribeSnapshot = null; 
        let currentImageBase64 = null; 

        function formatTimestamp(ts) {
            if (!ts) return "??.??.????";
            const date = new Date(ts);
            const pad = (n) => n.toString().padStart(2, '0');
            return `${pad(date.getDate())}.${pad(date.getMonth() + 1)}.${date.getFullYear()} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
        }

        function showMessage(elementId, text, isError = false) {
            const el = document.getElementById(elementId);
            el.innerText = `* ${text}`;
            el.className = `sys-msg ${isError ? 'msg-error' : 'msg-success'}`;
            setTimeout(() => { el.innerText = ''; }, 3000);
        }

        window.handleImageSelect = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    const MAX_HEIGHT = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    currentImageBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    
                    const preview = document.getElementById('image-preview');
                    preview.src = currentImageBase64;
                    preview.style.display = 'block';
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function resetImageUpload() {
            currentImageBase64 = null;
            document.getElementById('post-image-input').value = '';
            const preview = document.getElementById('image-preview');
            preview.src = '';
            preview.style.display = 'none';
        }

        function renderPosts() {
            const container = document.getElementById('feed-container');
            container.innerHTML = '';

            if (posts.length === 0) {
                container.innerHTML = '<div class="dr-box post-card"><div class="post-content" style="opacity:0.5;">* Здесь пока пусто...</div></div>';
                return;
            }

            const currentUser = sessionStorage.getItem('gww_user');
            const isLoggedIn = !!currentUser;

            posts.forEach(post => {
                let cardClass = '';
                if (post.author === 'СИСТЕМА') {
                    cardClass = 'system-post';
                } else if (VALID_USERS.hasOwnProperty(post.author)) {
                    cardClass = 'admin-post';
                }

                const card = document.createElement('div');
                card.className = `dr-box post-card ${cardClass}`;
                
                const safeText = post.text ? post.text.replace(/</g, "&lt;").replace(/>/g, "&gt;") : "";
                const imgHtml = post.image ? `<img src="${post.image}" class="post-img" alt="Прикрепленный файл">` : '';

                let deleteBtnHtml = '';
                if (isLoggedIn) {
                    deleteBtnHtml = `<button class="delete-btn" onclick="deletePost('${post.id}')" title="Удалить">[X]</button>`;
                }

                let displayAuthor = post.author || "АНОНИМ";
                if (displayAuthor === 'DrGnusin') {
                    displayAuthor = 'DrGnusin <span style="color: var(--dr-cyan); text-shadow: 2px 2px 0px #000;">[DEV]</span>';
                }

                let repliesHtml = '';
                const replies = post.replies || [];

                if (replies.length > 0 || isLoggedIn) {
                    repliesHtml += '<div class="replies-section">';
                    
                    if (replies.length > 0) {
                        replies.forEach(reply => {
                            let rAuthor = reply.author || 'АНОНИМ';
                            if (rAuthor === 'DrGnusin') {
                                rAuthor = 'DrGnusin <span style="color: var(--dr-cyan); text-shadow: 2px 2px 0px #000;">[DEV]</span>';
                            }
                            let rClass = reply.author === 'СИСТЕМА' ? 'system-post' : '';
                            const safeReplyText = reply.text ? reply.text.replace(/</g, "&lt;").replace(/>/g, "&gt;") : "";
                            
                            let replyDeleteBtnHtml = '';
                            if (isLoggedIn) {
                                const replyId = reply.id || reply.timestamp;
                                replyDeleteBtnHtml = `<button class="delete-btn" onclick="deleteReply('${post.id}', '${replyId}')" title="Удалить">[X]</button>`;
                            }

                            repliesHtml += `
                                <div class="reply-card ${rClass}">
                                    <div class="reply-header">
                                        <div>
                                            <span class="post-author" style="font-size: 0.7rem;">${rAuthor}</span>
                                            <span class="post-time" style="margin-left: 10px;">${formatTimestamp(reply.timestamp)}</span>
                                        </div>
                                        ${replyDeleteBtnHtml}
                                    </div>
                                    <div class="post-content" style="font-size: 1.2rem;">* ${safeReplyText}</div>
                                </div>
                            `;
                        });
                    }
                    
                    if (isLoggedIn) {
                        repliesHtml += `
                            <div class="reply-form">
                                <input type="text" id="reply-input-${post.id}" placeholder="Ответить...">
                                <button class="reply-btn" onclick="submitReply('${post.id}')">[ ОТПРАВИТЬ ]</button>
                            </div>
                        `;
                    }
                    repliesHtml += '</div>';
                }

                card.innerHTML = `
                    <div class="post-header">
                        <div>
                            <span class="post-author">${displayAuthor}</span>
                            <span class="post-time" style="margin-left: 15px;">${formatTimestamp(post.timestamp)}</span>
                        </div>
                        ${deleteBtnHtml}
                    </div>
                    <div class="post-content">* ${safeText}</div>
                    ${imgHtml}
                    ${repliesHtml}
                `;
                container.appendChild(card);
            });
        }

        window.switchBranch = function(branchName) {
            currentBranch = branchName;
            
            document.getElementById('btn-raylit').classList.remove('active');
            document.getElementById('btn-solar').classList.remove('active');
            
            if (branchName === 'raylit_posts') document.getElementById('btn-raylit').classList.add('active');
            if (branchName === 'solar_posts') document.getElementById('btn-solar').classList.add('active');
            
            document.getElementById('feed-container').innerHTML = '<div class="dr-box post-card"><div class="post-content" style="opacity:0.5;">* Смена частоты... Загрузка...</div></div>';
            
            listenToDatabase();
        }

        function checkSession() {
            const currentUser = sessionStorage.getItem('gww_user');
            
            if (currentUser) {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('post-section').style.display = 'block';
                
                let displayName = currentUser;
                if (currentUser === 'DrGnusin') {
                    displayName = 'DrGnusin <span style="color: var(--dr-cyan); text-shadow: 2px 2px 0px #000;">[DEV]</span>';
                }
                document.getElementById('current-user-display').innerHTML = displayName;

                const sysToggle = document.getElementById('system-post-toggle');
                if (sysToggle) {
                    if (currentUser === 'DrGnusin') {
                        sysToggle.style.display = 'block';
                    } else {
                        sysToggle.style.display = 'none';
                        document.getElementById('is-system-post').checked = false;
                    }
                }
            } else {
                document.getElementById('login-section').style.display = 'block';
                document.getElementById('post-section').style.display = 'none';
            }
            renderPosts();
        }

        window.attemptLogin = function() {
            const user = document.getElementById('login-username').value;
            const pin = document.getElementById('login-pin').value;

            if (VALID_USERS[user] && VALID_USERS[user] === pin) {
                sessionStorage.setItem('gww_user', user);
                document.getElementById('login-username').value = '';
                document.getElementById('login-pin').value = '';
                checkSession();
            } else {
                showMessage('login-sys-msg', 'ОШИБКА ДОСТУПА', true);
            }
        }

        window.logout = function() {
            sessionStorage.removeItem('gww_user');
            checkSession();
        }

        window.submitPost = async function() {
            const textarea = document.getElementById('post-text');
            const text = textarea.value.trim();
            const currentUser = sessionStorage.getItem('gww_user');
            const isSystemCheck = document.getElementById('is-system-post');
            const isSystem = isSystemCheck ? isSystemCheck.checked : false;

            if (!text && !currentImageBase64) {
                showMessage('post-sys-msg', 'ПУСТОЕ ПОЛЕ!', true);
                return;
            }

            let authorName = currentUser;
            if (isSystem && currentUser === 'DrGnusin') {
                authorName = 'СИСТЕМА';
            }

            const newPost = {
                author: authorName,
                text: text,
                timestamp: Date.now(),
                replies: []
            };
            
            if (currentImageBase64) {
                newPost.image = currentImageBase64;
            }

            try {
                if (!auth.currentUser) throw new Error("Нет авторизации для записи");
                // РАТИБОР: Теперь пишем прямо в корень базы, без дурацких папок!
                const postsCol = collection(db, currentBranch);
                await addDoc(postsCol, newPost);
                
                textarea.value = '';
                if (isSystemCheck) isSystemCheck.checked = false;
                resetImageUpload();
                showMessage('post-sys-msg', 'СОХРАНЕНО', false);
            } catch (e) {
                console.error("Ошибка при отправке:", e);
                showMessage('post-sys-msg', 'ОШИБКА БАЗЫ', true);
            }
        }

        window.deletePost = async function(postId) {
            try {
                if (!auth.currentUser) return;
                // И удаляем тоже из корня
                const docRef = doc(db, currentBranch, postId);
                await deleteDoc(docRef);
            } catch (e) {
                console.error("Ошибка при удалении:", e);
            }
        }

        window.submitReply = async function(postId) {
            const input = document.getElementById(`reply-input-${postId}`);
            const text = input.value.trim();
            if (!text) return;

            const currentUser = sessionStorage.getItem('gww_user');
            const isSystemCheck = document.getElementById('is-system-post');
            const isSystem = isSystemCheck ? isSystemCheck.checked : false;
            
            let authorName = currentUser;
            if (isSystem && currentUser === 'DrGnusin') {
                authorName = 'СИСТЕМА';
            }

            const newReply = {
                id: Date.now().toString() + Math.random().toString(36).substring(2, 8),
                author: authorName,
                text: text,
                timestamp: Date.now()
            };

            try {
                if (!auth.currentUser) return;
                const docRef = doc(db, currentBranch, postId);
                await updateDoc(docRef, {
                    replies: arrayUnion(newReply)
                });
                input.value = '';
            } catch (e) {
                console.error("Ошибка при отправке ответа:", e);
            }
        }

        window.deleteReply = async function(postId, replyIdentifier) {
            try {
                if (!auth.currentUser) return;
                const post = posts.find(p => p.id === postId);
                if (!post || !post.replies) return;

                const updatedReplies = post.replies.filter(r => {
                    if (r.id) return r.id !== replyIdentifier;
                    return r.timestamp.toString() !== replyIdentifier.toString();
                });

                const docRef = doc(db, currentBranch, postId);
                await updateDoc(docRef, { replies: updatedReplies });
            } catch (e) {
                console.error("Ошибка при удалении ответа:", e);
            }
        }

        function listenToDatabase() {
            if (!auth.currentUser) return; 
            
            if (unsubscribeSnapshot) {
                unsubscribeSnapshot();
            }

            // Читаем посты из корня базы!
            const postsCol = collection(db, currentBranch);
            
            document.getElementById('feed-container').innerHTML = '<div class="dr-box post-card"><div class="post-content" style="opacity:0.5;">* Загрузка постов...</div></div>';

            unsubscribeSnapshot = onSnapshot(postsCol, (snapshot) => {
                posts = [];
                snapshot.forEach((doc) => {
                    posts.push({ id: doc.id, ...doc.data() });
                });
                
                posts.sort((a, b) => b.timestamp - a.timestamp);
                renderPosts();
            }, (error) => {
                console.error("Сбой чтения БД:", error);
                document.getElementById('feed-container').innerHTML = `
                    <div class="dr-box post-card">
                        <div class="post-content msg-error" style="font-size: 1rem;">
                            * ОШИБКА БАЗЫ ДАННЫХ.<br><br>
                            Причина: ${error.message}<br><br>
                            Убедись, что твоя база Firestore в консоли Firebase переведена в ТЕСТОВЫЙ РЕЖИМ (Start in test mode).
                        </div>
                    </div>`;
            });
        }

        async function startApp() {
            const container = document.getElementById('feed-container');
            container.innerHTML = '<div class="dr-box post-card"><div class="post-content" style="opacity:0.5;">* Установка защищенного соединения...</div></div>';

            try {
                // Подключаемся к ТВОЕЙ базе анонимно
                await signInAnonymously(auth);
                // Если успешно - сразу читаем посты
                listenToDatabase();
            } catch (error) {
                console.error("Ошибка авторизации:", error);
                container.innerHTML = `
                    <div class="dr-box post-card">
                        <div class="post-content msg-error" style="font-size: 1rem;">
                            * ОШИБКА АВТОРИЗАЦИИ.<br><br>
                            Причина: ${error.message}<br><br>
                            Обязательно зайди в Firebase Console -> Authentication -> Sign-in method и включи "Anonymous" (Анонимный)! Без этого база не отдаст данные.
                        </div>
                    </div>`;
            }
        }

        // Запуск
        checkSession();
        startApp(); 

        document.getElementById('login-pin').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') window.attemptLogin();
        });
    </script>
</body>
</html>
