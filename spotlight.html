<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>GWW:Raylit // SPOTLIGHT</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        /* --- СТИЛИ HELLDIVERS --- */
        :root {
            --hd-yellow: #ffe80a;
            --hd-yellow-dim: #998b06;
            --hd-bg: #0a0c10;
            --hd-bg-panel: #14171c;
            --hd-red: #ff2a2a;
            --hd-cyan: #00f0ff;
            --text-color: var(--hd-yellow);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--hd-bg);
            color: var(--text-color);
            font-family: 'Share Tech Mono', monospace;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* CRT Scanline Effect */
        body::after {
            content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2; background-size: 100% 4px, 3px 100%; pointer-events: none;
        }

        @keyframes flicker {
            0% { opacity: 0.95; } 5% { opacity: 0.85; } 10% { opacity: 0.95; } 15% { opacity: 1; } 100% { opacity: 1; }
        }

        .container {
            width: 100%; max-width: 1000px; z-index: 1;
            animation: flicker 4s infinite; display: flex; flex-direction: column; gap: 20px;
        }

        .header {
            border-bottom: 2px solid var(--hd-yellow); padding-bottom: 10px;
            display: flex; justify-content: space-between; align-items: flex-end; text-transform: uppercase;
        }

        .system-status { font-size: 0.8rem; color: var(--hd-cyan); margin-bottom: 5px; letter-spacing: 2px; }
        h1 { font-size: 2.2rem; text-shadow: 0 0 10px rgba(255, 232, 10, 0.5); letter-spacing: 1px; }
        
        .header-right { text-align: right; }
        .nav-link { color: var(--hd-cyan); text-decoration: none; border-bottom: 1px solid transparent; transition: 0.2s; }
        .nav-link:hover { border-bottom: 1px solid var(--hd-cyan); text-shadow: 0 0 8px var(--hd-cyan); }

        /* --- ПЕРЕКЛЮЧАТЕЛЬ ВЕТОК --- */
        .branch-selector {
            display: flex; gap: 10px; border-bottom: 1px solid var(--hd-yellow-dim); padding-bottom: 10px;
        }
        .branch-btn {
            background: var(--hd-bg-panel); border: 1px solid var(--hd-yellow-dim); color: var(--hd-yellow-dim);
            padding: 10px 20px; font-family: inherit; font-size: 1.1rem; cursor: pointer; text-transform: uppercase;
            font-weight: bold; transition: 0.2s; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }
        .branch-btn:hover { border-color: var(--hd-yellow); color: var(--hd-yellow); }
        .branch-btn.active {
            background: var(--hd-yellow); color: var(--hd-bg); border-color: var(--hd-yellow);
            box-shadow: 0 0 10px rgba(255, 232, 10, 0.4);
        }

        /* --- ЛЕЙАУТ СТРАНИЦЫ --- */
        .main-grid {
            display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: start;
        }
        @media (max-width: 768px) { .main-grid { grid-template-columns: 1fr; } }

        /* --- ПАНЕЛИ И ФОРМЫ --- */
        .panel {
            background-color: var(--hd-bg-panel); border: 1px solid var(--hd-yellow-dim);
            padding: 20px; display: flex; flex-direction: column; gap: 15px;
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
        }

        .panel-title { font-size: 1.2rem; font-weight: bold; border-bottom: 1px solid var(--hd-yellow-dim); padding-bottom: 5px; margin-bottom: 10px; }

        input, textarea {
            background: rgba(0,0,0,0.5); border: 1px solid var(--hd-yellow-dim); color: var(--hd-cyan);
            font-family: inherit; font-size: 1rem; padding: 10px; width: 100%; outline: none; transition: 0.2s;
        }
        input:focus, textarea:focus { border-color: var(--hd-cyan); box-shadow: 0 0 5px rgba(0, 240, 255, 0.3); }
        textarea { resize: vertical; min-height: 100px; }

        button {
            background: transparent; border: 1px solid var(--hd-yellow); color: var(--hd-yellow);
            padding: 10px; font-family: inherit; font-size: 1rem; cursor: pointer; text-transform: uppercase; font-weight: bold; transition: 0.2s;
        }
        button:hover { background: var(--hd-yellow); color: var(--hd-bg); box-shadow: 0 0 10px rgba(255, 232, 10, 0.4); }
        
        .btn-danger { border-color: var(--hd-red); color: var(--hd-red); }
        .btn-danger:hover { background: var(--hd-red); color: white; box-shadow: 0 0 10px rgba(255, 42, 42, 0.4); }

        /* Загрузка файлов */
        .file-upload-btn {
            display: inline-block; text-align: center; border: 1px dashed var(--hd-cyan); color: var(--hd-cyan);
            padding: 8px; cursor: pointer; font-size: 0.85rem; transition: 0.2s; text-transform: uppercase;
        }
        .file-upload-btn:hover { background: rgba(0, 240, 255, 0.1); }
        #image-preview {
            max-width: 100%; margin-top: 10px; border: 1px solid var(--hd-yellow-dim); display: none;
        }

        .sys-msg { font-size: 0.85rem; min-height: 20px; }
        .msg-error { color: var(--hd-red); animation: blink 1s infinite; }
        .msg-success { color: var(--hd-cyan); }

        /* --- ЛЕНТА ПОСТОВ --- */
        .feed { display: flex; flex-direction: column; gap: 15px; }
        
        .post-card {
            background-color: var(--hd-bg-panel); border-left: 4px solid var(--hd-cyan);
            padding: 15px; position: relative; transition: 0.3s;
        }
        .post-card.admin-post { border-left-color: var(--hd-yellow); background: linear-gradient(90deg, rgba(255, 232, 10, 0.05) 0%, transparent 50%); }

        .post-header {
            display: flex; justify-content: space-between; align-items: flex-start;
            font-size: 0.85rem; color: var(--hd-yellow-dim); margin-bottom: 10px; border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom: 5px;
        }
        .post-author { color: var(--hd-yellow); font-weight: bold; }
        .post-time { opacity: 0.7; }
        .post-content { font-size: 1rem; line-height: 1.4; color: #fff; white-space: pre-wrap; }
        .post-img { max-width: 100%; border: 1px solid var(--hd-cyan); margin-top: 15px; box-shadow: 0 0 10px rgba(0, 240, 255, 0.1); }
        
        .delete-btn {
            background: transparent; border: 1px solid var(--hd-red); color: var(--hd-red);
            cursor: pointer; padding: 2px 8px; font-family: inherit; font-size: 0.8rem; font-weight: bold; margin-left: 10px; transition: 0.2s;
        }
        .delete-btn:hover { background: var(--hd-red); color: #000; }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <header class="header">
            <div class="header-left">
                <div class="system-status">GWW:RAYLIT // COMMUNICATIONS LINK</div>
                <h1>SPOTLIGHT TERMINAL</h1>
            </div>
            <div class="header-right">
                <a href="index.html" class="nav-link">&lt; ВЕРНУТЬСЯ В GWW:Raylit</a>
                <div style="margin-top: 10px; color: var(--hd-cyan); font-size: 0.8rem;">
                    [ENCRYPTION: ACTIVE]
                </div>
            </div>
        </header>

        <!-- BRANCH SELECTOR -->
        <div class="branch-selector">
            <button id="btn-raylit" class="branch-btn active" onclick="switchBranch('raylit_posts')">SPOTLIGHT: RAYLIT</button>
            <button id="btn-solar" class="branch-btn" onclick="switchBranch('solar_posts')">SPOTLIGHT: SOLAR</button>
        </div>

        <!-- MAIN GRID -->
        <main class="main-grid">
            
            <!-- Секция Управления (Левая панель) -->
            <aside>
                <!-- Форма Входа -->
                <div id="login-section" class="panel">
                    <div class="panel-title">АВТОРИЗАЦИЯ ОФИЦЕРА</div>
                    <div>
                        <label style="font-size: 0.8rem; opacity: 0.7;">ИДЕНТИФИКАТОР</label>
                        <input type="text" id="login-username" placeholder="ЛОГИН">
                    </div>
                    <div>
                        <label style="font-size: 0.8rem; opacity: 0.7;">PIN КОД ДОСТУПА</label>
                        <input type="password" id="login-pin" placeholder="****">
                    </div>
                    <button onclick="attemptLogin()">ПОДТВЕРДИТЬ</button>
                    <div id="login-sys-msg" class="sys-msg"></div>
                </div>

                <!-- Форма Постинга (Скрыта до входа) -->
                <div id="post-section" class="panel" style="display: none;">
                    <div class="panel-title">ТРАНСЛЯЦИЯ СТАТУСА</div>
                    <div style="color: var(--hd-cyan); font-size: 0.9rem;">
                        ОПЕРАТОР: <span id="current-user-display" style="color: var(--hd-yellow); font-weight: bold;"></span>
                    </div>
                    <textarea id="post-text" placeholder="Введите сообщение для трансляции..."></textarea>
                    
                    <!-- Блок загрузки изображения -->
                    <div>
                        <label for="post-image-input" class="file-upload-btn">📎 ПРИКРЕПИТЬ ФАЙЛ (ФОТО)</label>
                        <input type="file" id="post-image-input" accept="image/*" style="display: none;" onchange="handleImageSelect(event)">
                        <img id="image-preview" src="" alt="Preview">
                    </div>

                    <button onclick="submitPost()">ОПУБЛИКОВАТЬ В СЕТЬ</button>
                    <button class="btn-danger" onclick="logout()" style="margin-top: 10px; font-size: 0.8rem;">ЗАВЕРШИТЬ СЕАНС</button>
                    <div id="post-sys-msg" class="sys-msg"></div>
                </div>
            </aside>

            <!-- Лента постов (Правая панель) -->
            <section class="feed" id="feed-container">
                <div class="post-card">
                    <div class="post-content" style="opacity:0.5;">СИСТЕМА: УСТАНОВКА СВЯЗИ СО СПУТНИКОМ SUPER EARTH... ПОЖАЛУЙСТА ПОДОЖДИТЕ.</div>
                </div>
            </section>
        </main>
    </div>

    <!-- FIREBASE СКРИПТЫ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // РАТИБОР: Вставь сюда свой конфиг от Firebase!
        let firebaseConfig;
        if (typeof __firebase_config !== 'undefined') {
            firebaseConfig = JSON.parse(__firebase_config);
        } else {
            firebaseConfig = {
                apiKey: "AIzaSyAlGXzpw-cDNH7BScmIO4rjumj4Q8_sQKQ",
                authDomain: "gwwraylitspotlight.firebaseapp.com",
                projectId: "gwwraylitspotlight"
            };
        }

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        // --- КОНСТАНТЫ СИСТЕМЫ ---
        const VALID_USERS = {
            "DrGnusin": "3357",
            "mamanya": "120999",
            "Hjort": "8982"
        };
        
        let posts = [];
        let currentBranch = 'raylit_posts'; // Ветка по умолчанию
        let unsubscribeSnapshot = null; // Для отмены подписки при смене ветки
        let currentImageBase64 = null; // Для хранения фото

        // --- УТИЛИТЫ ---
        function formatTimestamp(ts) {
            const date = new Date(ts);
            const pad = (n) => n.toString().padStart(2, '0');
            return `CYCLE ${date.getFullYear()}.${pad(date.getMonth() + 1)}.${pad(date.getDate())} // ${pad(date.getHours())}:${pad(date.getMinutes())}`;
        }

        function showMessage(elementId, text, isError = false) {
            const el = document.getElementById(elementId);
            el.innerText = text;
            el.className = `sys-msg ${isError ? 'msg-error' : 'msg-success'}`;
            setTimeout(() => { el.innerText = ''; }, 3000);
        }

        // --- ЛОГИКА ИЗОБРАЖЕНИЙ ---
        window.handleImageSelect = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    // Сжимаем картинку через Canvas, чтобы она влезла в базу данных (лимит 1мб)
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    const MAX_HEIGHT = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // Переводим в Base64 с качеством 70%
                    currentImageBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    
                    const preview = document.getElementById('image-preview');
                    preview.src = currentImageBase64;
                    preview.style.display = 'block';
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function resetImageUpload() {
            currentImageBase64 = null;
            document.getElementById('post-image-input').value = '';
            const preview = document.getElementById('image-preview');
            preview.src = '';
            preview.style.display = 'none';
        }

        // --- РЕНДЕР ИНТЕРФЕЙСА ---
        function renderPosts() {
            const container = document.getElementById('feed-container');
            container.innerHTML = '';

            if (posts.length === 0) {
                container.innerHTML = '<div class="post-card"><div class="post-content" style="opacity:0.5;">СИСТЕМА: СВЯЗЬ УСТАНОВЛЕНА. В ДАННОЙ ВЕТКЕ НЕТ ТРАНСЛЯЦИЙ.</div></div>';
                return;
            }

            const currentUser = sessionStorage.getItem('gww_user');
            const isLoggedIn = !!currentUser;

            posts.forEach(post => {
                const card = document.createElement('div');
                card.className = `post-card ${VALID_USERS.hasOwnProperty(post.author) ? 'admin-post' : ''}`;
                
                const safeText = post.text ? post.text.replace(/</g, "&lt;").replace(/>/g, "&gt;") : "";
                
                // Рендерим картинку, если она есть в базе
                const imgHtml = post.image ? `<img src="${post.image}" class="post-img" alt="Прикрепленный файл">` : '';

                let deleteBtnHtml = '';
                if (isLoggedIn) {
                    deleteBtnHtml = `<button class="delete-btn" onclick="deletePost('${post.id}')">[X]</button>`;
                }

                card.innerHTML = `
                    <div class="post-header">
                        <div>
                            <span class="post-author">[ ${post.author || "СИСТЕМА"} ]</span>
                            <span class="post-time">${formatTimestamp(post.timestamp)}</span>
                        </div>
                        ${deleteBtnHtml}
                    </div>
                    <div class="post-content">${safeText}</div>
                    ${imgHtml}
                `;
                container.appendChild(card);
            });
        }

        // --- ЛОГИКА ВЕТОК ---
        window.switchBranch = function(branchName) {
            currentBranch = branchName;
            
            // Обновляем кнопки
            document.getElementById('btn-raylit').classList.remove('active');
            document.getElementById('btn-solar').classList.remove('active');
            
            if (branchName === 'raylit_posts') document.getElementById('btn-raylit').classList.add('active');
            if (branchName === 'solar_posts') document.getElementById('btn-solar').classList.add('active');
            
            // Показываем загрузку
            document.getElementById('feed-container').innerHTML = '<div class="post-card"><div class="post-content" style="opacity:0.5;">ПЕРЕКЛЮЧЕНИЕ ЧАСТОТЫ СВЯЗИ...</div></div>';
            
            // Переподключаемся к нужной коллекции
            listenToDatabase();
        }

        // --- ЛОГИКА АВТОРИЗАЦИИ И ПОСТИНГА ---
        function checkSession() {
            const currentUser = sessionStorage.getItem('gww_user');
            
            if (currentUser) {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('post-section').style.display = 'flex';
                document.getElementById('current-user-display').innerText = currentUser;
            } else {
                document.getElementById('login-section').style.display = 'flex';
                document.getElementById('post-section').style.display = 'none';
            }
            renderPosts();
        }

        window.attemptLogin = function() {
            const user = document.getElementById('login-username').value;
            const pin = document.getElementById('login-pin').value;

            if (VALID_USERS[user] && VALID_USERS[user] === pin) {
                sessionStorage.setItem('gww_user', user);
                document.getElementById('login-username').value = '';
                document.getElementById('login-pin').value = '';
                checkSession();
            } else {
                showMessage('login-sys-msg', 'ОШИБКА: ДОСТУП ЗАПРЕЩЕН.', true);
            }
        }

        window.logout = function() {
            sessionStorage.removeItem('gww_user');
            checkSession();
        }

        window.submitPost = async function() {
            const textarea = document.getElementById('post-text');
            const text = textarea.value.trim();
            const currentUser = sessionStorage.getItem('gww_user');

            if (!text && !currentImageBase64) {
                showMessage('post-sys-msg', 'ОШИБКА: ПУСТОЕ СООБЩЕНИЕ ИЛИ ФАЙЛ', true);
                return;
            }

            // Формируем пост. Если есть фото — прикрепляем его
            const newPost = {
                author: currentUser,
                text: text,
                timestamp: Date.now()
            };
            
            if (currentImageBase64) {
                newPost.image = currentImageBase64;
            }

            try {
                // Сохраняем в текущую выбранную ветку (raylit или solar)
                const postsCol = collection(db, currentBranch);
                await addDoc(postsCol, newPost);
                
                // Очищаем форму
                textarea.value = '';
                resetImageUpload();
                showMessage('post-sys-msg', 'СТАТУС УСПЕШНО ТРАНСЛИРОВАН', false);
            } catch (e) {
                console.error("Ошибка при отправке:", e);
                showMessage('post-sys-msg', 'ОШИБКА СВЯЗИ С БАЗОЙ (возможно слишком большое фото)', true);
            }
        }

        window.deletePost = async function(postId) {
            try {
                const docRef = doc(db, currentBranch, postId);
                await deleteDoc(docRef);
            } catch (e) {
                console.error("Ошибка при удалении:", e);
            }
        }

        // --- ПОДКЛЮЧЕНИЕ К БД ---
        function listenToDatabase() {
            // Если мы уже слушаем старую ветку — отключаемся от неё
            if (unsubscribeSnapshot) {
                unsubscribeSnapshot();
            }

            const postsCol = collection(db, currentBranch);
            
            unsubscribeSnapshot = onSnapshot(postsCol, (snapshot) => {
                posts = [];
                snapshot.forEach((doc) => {
                    posts.push({ id: doc.id, ...doc.data() });
                });
                
                // Сортируем: новые сверху
                posts.sort((a, b) => b.timestamp - a.timestamp);
                renderPosts();
            }, (error) => {
                console.error("Сбой чтения БД:", error);
            });
        }

        // --- ЗАПУСК ---
        window.onload = () => {
            checkSession();
            listenToDatabase(); // Подключаемся к базе по умолчанию (Raylit)

            document.getElementById('login-pin').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') window.attemptLogin();
            });
        };
    </script>
</body>
</html>
