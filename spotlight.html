<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>VSKY SPOTLIGHT</title>
    <!-- Подключаем Teko для заголовков (в стиле TF2 Build) и Roboto для читаемого текста -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Teko:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --tf-bg-dark: #2A2725;
            --tf-bg-panel: #3B3631;
            --tf-bg-paper: #EAE3C8;
            --tf-border-dark: #1D1B1A;
            --tf-border-paper: #8A7C6B;
            
            --tf-text-light: #EBE2CA;
            --tf-text-dark: #2A2725;
            
            --tf-red: #B8383B;
            --tf-red-dark: #8E2B2E;
            --tf-blu: #5885A2;
            --tf-blu-dark: #3F6076;
            --tf-orange: #E7B53B;
            --tf-admin-purple: #4A3A4A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--tf-bg-dark);
            background-image: radial-gradient(circle at center, #3c3732 0%, #2A2725 100%);
            color: var(--tf-text-light);
            font-family: 'Roboto', sans-serif;
            font-size: 1.1rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h1, h2, h3, .tf-heading {
            font-family: 'Teko', sans-serif;
            text-transform: uppercase;
            font-weight: 600;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--tf-bg-panel);
            border: 4px solid var(--tf-border-dark);
            border-radius: 8px;
            padding: 15px 25px;
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.05), 0 4px 10px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 3.5rem;
            color: var(--tf-text-light);
            text-shadow: 2px 2px 0px #000, 4px 4px 0px rgba(0,0,0,0.5);
            line-height: 1;
            letter-spacing: 1px;
        }

        .nav-link {
            font-family: 'Teko', sans-serif;
            font-size: 1.8rem;
            color: var(--tf-text-light);
            text-decoration: none;
            background-color: var(--tf-border-dark);
            padding: 5px 15px;
            border-radius: 4px;
            transition: 0.1s;
        }
        
        .nav-link:hover {
            background-color: var(--tf-orange);
            color: var(--tf-border-dark);
        }

        .branch-selector {
            display: flex;
            gap: 0;
            border-radius: 8px;
            overflow: hidden;
            border: 4px solid var(--tf-border-dark);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .branch-btn {
            flex: 1;
            background: var(--tf-bg-panel);
            border: none;
            color: rgba(255,255,255,0.5);
            font-family: 'Teko', sans-serif;
            font-size: 2.2rem;
            cursor: pointer;
            padding: 10px;
            transition: 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 1px 1px 0px #000;
        }

        .branch-btn:hover {
            color: var(--tf-text-light);
            background: #4A443E;
        }

        /* Активные состояния RED и BLU */
        .branch-btn#btn-raylit.active {
            background: var(--tf-red);
            color: white;
            box-shadow: inset 0 0 15px var(--tf-red-dark);
        }

        .branch-btn#btn-solar.active {
            background: #FFD700; /* Золотой цвет SOLAR */
            color: #1D1B1A; /* Тёмный текст для контраста */
            box-shadow: inset 0 0 15px #B8860B; /* Тёмно-золотое свечение внутри */
            text-shadow: none; /* Убираем черную тень, чтобы текст лучше читался на светлом фоне */
        }

        .main-grid {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            align-items: start;
        }

        @media (max-width: 768px) {
            .main-grid { grid-template-columns: 1fr; }
            .header { flex-direction: column; text-align: center; gap: 15px; }
        }

        .tf-sidebar-box {
            background-color: var(--tf-bg-panel);
            border: 4px solid var(--tf-border-dark);
            border-radius: 8px;
            padding: 20px;
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.05), 0 4px 10px rgba(0,0,0,0.5);
        }

        .panel-title {
            font-family: 'Teko', sans-serif;
            font-size: 2.5rem;
            color: var(--tf-orange);
            margin-bottom: 10px;
            line-height: 1;
            text-shadow: 1px 1px 0px #000;
            border-bottom: 2px solid var(--tf-border-dark);
            padding-bottom: 5px;
        }

        input[type="text"], input[type="password"], textarea {
            background: var(--tf-border-dark);
            border: 2px solid #111;
            border-radius: 4px;
            color: var(--tf-text-light);
            font-family: 'Roboto', sans-serif;
            font-size: 1rem;
            padding: 10px;
            width: 100%;
            outline: none;
            margin-bottom: 15px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
            transition: 0.1s;
        }

        input:focus, textarea:focus {
            border-color: var(--tf-orange);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button.act-btn {
            font-family: 'Teko', sans-serif;
            font-size: 1.8rem;
            letter-spacing: 1px;
            color: var(--tf-text-light);
            background: #504841;
            border: 2px solid var(--tf-border-dark);
            border-radius: 4px;
            padding: 5px 10px;
            cursor: pointer;
            width: 100%;
            transition: 0.1s;
            text-shadow: 1px 1px 0px #000;
            box-shadow: inset 0 2px 2px rgba(255,255,255,0.1), 0 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }

        button.act-btn:hover {
            background: var(--tf-orange);
            color: var(--tf-border-dark);
            text-shadow: none;
        }

        button.act-btn.danger {
            background: #504841;
        }

        button.act-btn.danger:hover {
            background: var(--tf-red);
            color: white;
        }

        .file-upload-btn {
            display: block;
            text-align: center;
            background: var(--tf-border-dark);
            border: 2px dashed #666;
            color: #aaa;
            padding: 10px;
            cursor: pointer;
            font-family: 'Teko', sans-serif;
            font-size: 1.5rem;
            margin-bottom: 15px;
            border-radius: 4px;
            transition: 0.1s;
        }

        .file-upload-btn:hover { 
            border-color: var(--tf-orange);
            color: var(--tf-orange);
        }

        #image-preview {
            max-width: 100%;
            margin-bottom: 15px;
            border: 4px solid var(--tf-border-dark);
            border-radius: 4px;
            display: none;
        }

        .sys-msg { font-size: 0.95rem; font-weight: bold; min-height: 20px; margin-top: 5px; }
        .msg-error { color: var(--tf-red); }
        .msg-success { color: #8FBC8B; }

        .feed {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .post-card {
            background-color: var(--tf-bg-paper);
            border: 4px solid var(--tf-border-paper);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            color: var(--tf-text-dark);
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            position: relative;
        }

        /* Стиль для админских постов (Офицеры) */
        .post-card.admin-post {
            border-color: var(--tf-red);
        }

        /* Стиль для сообщений СИСТЕМЫ (Администратор) */
        .post-card.system-post {
            background-color: var(--tf-border-dark);
            border-color: var(--tf-admin-purple);
            color: var(--tf-text-light);
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed rgba(0,0,0,0.2);
            padding-bottom: 8px;
        }

        .system-post .post-header {
            border-bottom-color: rgba(255,255,255,0.2);
        }

        .post-author {
            font-family: 'Teko', sans-serif;
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .admin-post .post-author { color: var(--tf-red-dark); }
        .system-post .post-author { color: var(--tf-orange); }
        
        .dev-badge {
            color: var(--tf-orange);
            background: var(--tf-border-dark);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 1.2rem;
            margin-left: 5px;
            vertical-align: middle;
        }

        .post-time { 
            font-size: 0.9rem; 
            opacity: 0.7; 
            font-family: 'Roboto', sans-serif;
        }

        .post-content {
            font-size: 1.15rem;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .post-img {
            max-width: 100%;
            border: 4px solid var(--tf-border-dark);
            border-radius: 4px;
            margin-top: 5px;
        }
        
        .delete-btn {
            background: transparent;
            border: none;
            color: var(--tf-red);
            cursor: pointer;
            font-family: 'Roboto', sans-serif;
            font-weight: bold;
            font-size: 1.2rem;
            transition: 0.1s;
        }

        .delete-btn:hover { color: #000; transform: scale(1.2); }
        .system-post .delete-btn:hover { color: white; }

        .replies-section {
            margin-top: 10px;
            background: rgba(0,0,0,0.05);
            border: 2px solid rgba(0,0,0,0.1);
            padding: 15px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .system-post .replies-section {
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.1);
        }

        .reply-card {
            border-left: 4px solid var(--tf-border-paper);
            padding-left: 12px;
        }

        .reply-card.system-post {
            border-left-color: var(--tf-orange);
        }

        .reply-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 5px;
            align-items: center;
        }

        .reply-form {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .reply-form input {
            margin-bottom: 0;
            background: #fff;
            color: #000;
            border: 2px solid var(--tf-border-paper);
        }

        .system-post .reply-form input {
            background: var(--tf-border-dark);
            color: white;
            border-color: #555;
        }

        .reply-btn {
            font-family: 'Teko', sans-serif;
            font-size: 1.4rem;
            background: var(--tf-border-dark);
            color: white;
            border: none;
            padding: 0 15px;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.1s;
            white-space: nowrap;
        }

        .reply-btn:hover {
            background: var(--tf-orange);
            color: #000;
        }
        
        /* Крутилка TF2 для загрузки */
        .tf-spinner {
            width: 50px;
            height: 50px;
            animation: spin 1.5s linear infinite;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
            display: block;
            margin: 0 auto;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="header">
            <div>
                <div style="font-family: 'Roboto', sans-serif; font-size: 0.9rem; color: #888; margin-bottom: 5px; font-weight: bold;">[ ЗАСЕКРЕЧЕНО / MANN CO. ]</div>
                <h1>VSKY SPOTLIGHT</h1>
            </div>
            <a href="index.html" class="nav-link">НА БАЗУ &raquo;</a>
        </header>

        <div class="branch-selector">
            <button id="btn-raylit" class="branch-btn active" onclick="switchBranch('raylit_posts')">VSKY</button>
            <button id="btn-solar" class="branch-btn" onclick="switchBranch('solar_posts')">SOLAR</button>
        </div>

        <main class="main-grid">
            <aside>
                <!-- БЛОК ЛОГИНА -->
                <div id="login-section" class="tf-sidebar-box">
                    <div class="panel-title">АВТОРИЗАЦИЯ</div>
                    <div><input type="text" id="login-username" placeholder="ИМЯ НАЁМНИКА"></div>
                    <div><input type="password" id="login-pin" placeholder="PIN-КОД"></div>
                    <button class="act-btn" onclick="attemptLogin()">ВОЙТИ</button>
                    <div id="login-sys-msg" class="sys-msg"></div>
                </div>

                <!-- БЛОК ПУБЛИКАЦИИ (Скрыт для гостей) -->
                <div id="post-section" class="tf-sidebar-box" style="display: none;">
                    <div class="panel-title">СВЯЗЬ</div>
                    <div style="font-family: 'Roboto', sans-serif; font-size: 0.85rem; color: #aaa; margin-bottom: 15px;">
                        ОПЕРАТОР: <span id="current-user-display" style="color: var(--tf-orange); font-weight: bold;"></span>
                    </div>
                    <textarea id="post-text" placeholder="Введите сообщение для команды..."></textarea>
                    
                    <div>
                        <label for="post-image-input" class="file-upload-btn">ПРИКРЕПИТЬ ФОТО</label>
                        <input type="file" id="post-image-input" accept="image/*" style="display: none;" onchange="handleImageSelect(event)">
                        <img id="image-preview" src="" alt="Preview">
                    </div>

                    <!-- Галочка СИСТЕМЫ (Только для DrGnusin) -->
                    <div id="system-post-toggle" style="display: none; margin-bottom: 15px; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 4px;">
                        <label style="color: var(--tf-orange); font-family: 'Teko', sans-serif; font-size: 1.4rem; cursor: pointer; display: flex; align-items: center; gap: 8px;">
                            <input type="checkbox" id="is-system-post" style="width: 20px; height: 20px; margin: 0;">
                            ОТ ЛИЦА АДМИНИСТРАТОРА
                        </label>
                    </div>

                    <button class="act-btn" onclick="submitPost()">ОТПРАВИТЬ</button>
                    <button class="act-btn danger" onclick="logout()">ВЫЙТИ ИЗ ТЕРМИНАЛА</button>
                    <div id="post-sys-msg" class="sys-msg"></div>
                </div>
            </aside>

            <section class="feed" id="feed-container">
                <!-- Сюда подгружаются посты -->
            </section>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ключи от Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAlGXzpw-cDNH7BScmIO4rjumj4Q8_sQKQ",
            authDomain: "gwwraylitspotlight.firebaseapp.com",
            projectId: "gwwraylitspotlight",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app); 
        const db = getFirestore(app);
        
        // База аккаунтов (Наёмники)
        const VALID_USERS = {
            "DrGnusin": "3357",
            "mamanya": "120999",
            "Hjort": "8982"
        };
        
        let posts = [];
        let currentBranch = 'raylit_posts'; 
        let unsubscribeSnapshot = null; 
        let currentImageBase64 = null; 

        function formatTimestamp(ts) {
            if (!ts) return "??.??.????";
            const date = new Date(ts);
            const pad = (n) => n.toString().padStart(2, '0');
            return `${pad(date.getDate())}.${pad(date.getMonth() + 1)}.${date.getFullYear()} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
        }

        function showMessage(elementId, text, isError = false) {
            const el = document.getElementById(elementId);
            el.innerText = text;
            el.className = `sys-msg ${isError ? 'msg-error' : 'msg-success'}`;
            setTimeout(() => { el.innerText = ''; }, 3000);
        }

        // Загрузка и сжатие изображений
        window.handleImageSelect = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    const MAX_HEIGHT = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    currentImageBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    
                    const preview = document.getElementById('image-preview');
                    preview.src = currentImageBase64;
                    preview.style.display = 'block';
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function resetImageUpload() {
            currentImageBase64 = null;
            document.getElementById('post-image-input').value = '';
            const preview = document.getElementById('image-preview');
            preview.src = '';
            preview.style.display = 'none';
        }

        function renderPosts() {
            const container = document.getElementById('feed-container');
            container.innerHTML = '';

            if (posts.length === 0) {
                container.innerHTML = '<div class="post-card"><div class="post-content" style="opacity:0.5; font-style: italic;">База данных пуста...</div></div>';
                return;
            }

            const currentUser = sessionStorage.getItem('gww_user');
            const isLoggedIn = !!currentUser;

            posts.forEach(post => {
                let cardClass = '';
                if (post.author === 'АДМИНИСТРАТОР') {
                    cardClass = 'system-post';
                } else if (VALID_USERS.hasOwnProperty(post.author)) {
                    cardClass = 'admin-post';
                }

                const card = document.createElement('div');
                card.className = `post-card ${cardClass}`;
                
                const safeText = post.text ? post.text.replace(/</g, "&lt;").replace(/>/g, "&gt;") : "";
                const imgHtml = post.image ? `<img src="${post.image}" class="post-img" alt="Прикрепленный файл">` : '';

                let deleteBtnHtml = '';
                if (isLoggedIn) {
                    deleteBtnHtml = `<button class="delete-btn" onclick="deletePost('${post.id}')" title="Удалить пост">✖</button>`;
                }

                // Логика бейджа разработчика (Strange Quality)
                let displayAuthor = post.author || "НЕИЗВЕСТНЫЙ";
                if (displayAuthor === 'DrGnusin') {
                    displayAuthor = 'DrGnusin <span class="dev-badge">DEV</span>';
                }

                // Комментарии
                let repliesHtml = '';
                const replies = post.replies || [];

                if (replies.length > 0 || isLoggedIn) {
                    repliesHtml += '<div class="replies-section">';
                    
                    if (replies.length > 0) {
                        replies.forEach(reply => {
                            let rAuthor = reply.author || 'АНОНИМ';
                            if (rAuthor === 'DrGnusin') {
                                rAuthor = 'DrGnusin <span class="dev-badge" style="font-size: 1rem;">DEV</span>';
                            }
                            let rClass = reply.author === 'АДМИНИСТРАТОР' ? 'system-post' : '';
                            const safeReplyText = reply.text ? reply.text.replace(/</g, "&lt;").replace(/>/g, "&gt;") : "";
                            
                            let replyDeleteBtnHtml = '';
                            if (isLoggedIn) {
                                const replyId = reply.id || reply.timestamp;
                                replyDeleteBtnHtml = `<button class="delete-btn" onclick="deleteReply('${post.id}', '${replyId}')" title="Удалить ответ">✖</button>`;
                            }

                            repliesHtml += `
                                <div class="reply-card ${rClass}">
                                    <div class="reply-header">
                                        <div>
                                            <span class="post-author" style="font-size: 1.2rem;">${rAuthor}</span>
                                            <span class="post-time" style="margin-left: 10px;">${formatTimestamp(reply.timestamp)}</span>
                                        </div>
                                        ${replyDeleteBtnHtml}
                                    </div>
                                    <div class="post-content" style="font-size: 1rem;">${safeReplyText}</div>
                                </div>
                            `;
                        });
                    }
                    
                    if (isLoggedIn) {
                        repliesHtml += `
                            <div class="reply-form">
                                <input type="text" id="reply-input-${post.id}" placeholder="Оставить комментарий...">
                                <button class="reply-btn" onclick="submitReply('${post.id}')">ОТВЕТИТЬ</button>
                            </div>
                        `;
                    }
                    repliesHtml += '</div>';
                }

                card.innerHTML = `
                    <div class="post-header">
                        <div>
                            <span class="post-author">${displayAuthor}</span>
                            <span class="post-time" style="margin-left: 15px;">${formatTimestamp(post.timestamp)}</span>
                        </div>
                        ${deleteBtnHtml}
                    </div>
                    <div class="post-content">${safeText}</div>
                    ${imgHtml}
                    ${repliesHtml}
                `;
                container.appendChild(card);
            });
        }

        // Переключение между RED и BLU ветками
        window.switchBranch = function(branchName) {
            currentBranch = branchName;
            
            document.getElementById('btn-raylit').classList.remove('active');
            document.getElementById('btn-solar').classList.remove('active');
            
            if (branchName === 'raylit_posts') document.getElementById('btn-raylit').classList.add('active');
            if (branchName === 'solar_posts') document.getElementById('btn-solar').classList.add('active');
            
            document.getElementById('feed-container').innerHTML = '<div class="post-card" style="text-align: center; background: transparent; border: none; box-shadow: none;"><img src="https://file.garden/aUk_YK3Gbmwc6_an/tf.png" class="tf-spinner" alt="Loading..."><div style="margin-top: 15px; font-family: Teko, sans-serif; font-size: 1.8rem; color: var(--tf-text-light); text-shadow: 1px 1px 2px #000;">ПОДКЛЮЧЕНИЕ К РАДИОЧАСТОТЕ...</div></div>';
            
            listenToDatabase();
        }

        function checkSession() {
            const currentUser = sessionStorage.getItem('gww_user');
            
            if (currentUser) {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('post-section').style.display = 'block';
                
                let displayName = currentUser;
                if (currentUser === 'DrGnusin') {
                    displayName = 'DrGnusin (ADMIN)';
                }
                document.getElementById('current-user-display').innerText = displayName;

                // Показываем галочку системы только для DrGnusin
                const sysToggle = document.getElementById('system-post-toggle');
                if (sysToggle) {
                    if (currentUser === 'DrGnusin') {
                        sysToggle.style.display = 'block';
                    } else {
                        sysToggle.style.display = 'none';
                        document.getElementById('is-system-post').checked = false;
                    }
                }
            } else {
                document.getElementById('login-section').style.display = 'block';
                document.getElementById('post-section').style.display = 'none';
            }
            renderPosts();
        }

        window.attemptLogin = function() {
            const user = document.getElementById('login-username').value;
            const pin = document.getElementById('login-pin').value;

            if (VALID_USERS[user] && VALID_USERS[user] === pin) {
                sessionStorage.setItem('gww_user', user);
                document.getElementById('login-username').value = '';
                document.getElementById('login-pin').value = '';
                checkSession();
            } else {
                showMessage('login-sys-msg', 'ОТКАЗАНО В ДОСТУПЕ', true);
            }
        }

        window.logout = function() {
            sessionStorage.removeItem('gww_user');
            checkSession();
        }

        window.submitPost = async function() {
            const textarea = document.getElementById('post-text');
            const text = textarea.value.trim();
            const currentUser = sessionStorage.getItem('gww_user');
            const isSystemCheck = document.getElementById('is-system-post');
            const isSystem = isSystemCheck ? isSystemCheck.checked : false;

            if (!text && !currentImageBase64) {
                showMessage('post-sys-msg', 'ПУСТОЕ ПОЛЕ!', true);
                return;
            }

            let authorName = currentUser;
            if (isSystem && currentUser === 'DrGnusin') {
                authorName = 'АДМИНИСТРАТОР';
            }

            const newPost = {
                author: authorName,
                text: text,
                timestamp: Date.now(),
                replies: []
            };
            
            if (currentImageBase64) {
                newPost.image = currentImageBase64;
            }

            try {
                if (!auth.currentUser) throw new Error("Нет авторизации для записи");
                // Пишем в корень базы, в выбранную ветку
                const postsCol = collection(db, currentBranch);
                await addDoc(postsCol, newPost);
                
                textarea.value = '';
                if (isSystemCheck) isSystemCheck.checked = false;
                resetImageUpload();
                showMessage('post-sys-msg', 'СООБЩЕНИЕ ОТПРАВЛЕНО', false);
            } catch (e) {
                console.error("Ошибка при отправке:", e);
                showMessage('post-sys-msg', 'ОШИБКА СЕТИ', true);
            }
        }

        // Удаление постов и ответов
        window.deletePost = async function(postId) {
            try {
                if (!auth.currentUser) return;
                const docRef = doc(db, currentBranch, postId);
                await deleteDoc(docRef);
            } catch (e) {
                console.error("Ошибка при удалении:", e);
            }
        }

        window.submitReply = async function(postId) {
            const input = document.getElementById(`reply-input-${postId}`);
            const text = input.value.trim();
            if (!text) return;

            const currentUser = sessionStorage.getItem('gww_user');
            const isSystemCheck = document.getElementById('is-system-post');
            const isSystem = isSystemCheck ? isSystemCheck.checked : false;
            
            let authorName = currentUser;
            if (isSystem && currentUser === 'DrGnusin') {
                authorName = 'АДМИНИСТРАТОР';
            }

            const newReply = {
                id: Date.now().toString() + Math.random().toString(36).substring(2, 8),
                author: authorName,
                text: text,
                timestamp: Date.now()
            };

            try {
                if (!auth.currentUser) return;
                const docRef = doc(db, currentBranch, postId);
                await updateDoc(docRef, {
                    replies: arrayUnion(newReply)
                });
                input.value = '';
            } catch (e) {
                console.error("Ошибка при отправке ответа:", e);
            }
        }

        window.deleteReply = async function(postId, replyIdentifier) {
            try {
                if (!auth.currentUser) return;
                const post = posts.find(p => p.id === postId);
                if (!post || !post.replies) return;

                const updatedReplies = post.replies.filter(r => {
                    if (r.id) return r.id !== replyIdentifier;
                    return r.timestamp.toString() !== replyIdentifier.toString();
                });

                const docRef = doc(db, currentBranch, postId);
                await updateDoc(docRef, { replies: updatedReplies });
            } catch (e) {
                console.error("Ошибка при удалении ответа:", e);
            }
        }

        function listenToDatabase() {
            if (!auth.currentUser) return; 
            
            if (unsubscribeSnapshot) {
                unsubscribeSnapshot();
            }

            // Слушаем корень базы (коллекции raylit_posts или solar_posts)
            const postsCol = collection(db, currentBranch);
            
            document.getElementById('feed-container').innerHTML = '<div class="post-card" style="text-align: center; background: transparent; border: none; box-shadow: none;"><img src="https://file.garden/aUk_YK3Gbmwc6_an/tf.png" class="tf-spinner" alt="Loading..."><div style="margin-top: 15px; font-family: Teko, sans-serif; font-size: 1.8rem; color: var(--tf-text-light); text-shadow: 1px 1px 2px #000;">ЗАГРУЗКА ДАННЫХ РАЗВЕДКИ...</div></div>';

            unsubscribeSnapshot = onSnapshot(postsCol, (snapshot) => {
                posts = [];
                snapshot.forEach((doc) => {
                    posts.push({ id: doc.id, ...doc.data() });
                });
                
                posts.sort((a, b) => b.timestamp - a.timestamp);
                renderPosts();
            }, (error) => {
                console.error("Сбой чтения БД:", error);
                document.getElementById('feed-container').innerHTML = `
                    <div class="post-card">
                        <div class="post-content msg-error">
                            ОШИБКА БАЗЫ ДАННЫХ: ${error.message}
                        </div>
                    </div>`;
            });
        }

        // Запуск
        const container = document.getElementById('feed-container');
        container.innerHTML = '<div class="post-card" style="text-align: center; background: transparent; border: none; box-shadow: none;"><img src="https://file.garden/aUk_YK3Gbmwc6_an/tf.png" class="tf-spinner" alt="Loading..."><div style="margin-top: 15px; font-family: Teko, sans-serif; font-size: 1.8rem; color: var(--tf-text-light); text-shadow: 1px 1px 2px #000;">АВТОРИЗАЦИЯ В СИСТЕМЕ MANN CO...</div></div>';

        signInAnonymously(auth).catch((error) => {
            console.error("Ошибка авторизации:", error);
            container.innerHTML = `
                <div class="post-card">
                    <div class="post-content msg-error">
                        ОШИБКА АВТОРИЗАЦИИ: ${error.message}<br>
                    </div>
                </div>`;
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                listenToDatabase();
            }
        });

        checkSession();

        // Отправка PIN-кода на Enter
        document.getElementById('login-pin').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') window.attemptLogin();
        });
    </script>
</body>
</html>
