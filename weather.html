<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ветеркомм</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #333;
        }
        .header {
            margin-bottom: 30px;
            margin-top: 20px;
        }
        .logo {
            max-width: 250px;
            height: auto;
            display: block;
        }
        .weather-app {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        .search-box input {
            flex: 1;
            padding: 15px 20px;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.9);
            font-size: 1.1rem;
            outline: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: 0.2s;
        }
        .search-box input:focus {
            box-shadow: 0 4px 12px rgba(102, 166, 255, 0.3);
        }
        .search-box button {
            background: #66a6ff;
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 0 25px;
            font-size: 1.1rem;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        .search-box button:hover {
            background: #5596e6;
            transform: translateY(-2px);
        }
        .weather-info {
            display: none;
            flex-direction: column;
            align-items: center;
        }
        .weather-icon {
            width: 150px;
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.1));
        }
        .temp {
            font-size: 4rem;
            font-weight: 800;
            margin-bottom: 5px;
            color: #2c3e50;
        }
        .city-name {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: #34495e;
        }
        .description {
            font-size: 1.2rem;
            color: #7f8c8d;
            text-transform: capitalize;
            margin-bottom: 20px;
        }
        .details {
            display: flex;
            justify-content: space-around;
            width: 100%;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid rgba(0,0,0,0.05);
        }
        .detail-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .detail-value {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2c3e50;
        }
        .detail-label {
            font-size: 0.9rem;
            color: #7f8c8d;
        }
        .error-message {
            display: none;
            color: #e74c3c;
            font-size: 1.2rem;
            margin-top: 20px;
            font-weight: 500;
        }
        .back-link {
            margin-top: 40px;
            text-decoration: none;
            color: #ffffff;
            font-weight: 600;
            font-size: 1.1rem;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 20px;
            border-radius: 20px;
            transition: 0.2s;
        }
        .back-link:hover {
            background: rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="https://gnusinrat.github.io/assets/WeatherCommLogo.png" alt="ветеркомм" class="logo" onerror="this.style.display='none'">
    </div>

    <div class="weather-app">
        <div class="search-box">
            <input type="text" id="city-input" placeholder="Введите город...">
            <button id="search-btn">Поиск</button>
        </div>

        <div class="error-message" id="error-msg">Город не найден</div>

        <div class="weather-info" id="weather-info">
            <img src="" alt="Weather Icon" class="weather-icon" id="w-icon">
            <div class="temp" id="w-temp"></div>
            <div class="city-name" id="w-city"></div>
            <div class="description" id="w-desc"></div>
            
            <div class="details">
                <div class="detail-item">
                    <span class="detail-value" id="w-humidity"></span>
                    <span class="detail-label">Влажность</span>
                </div>
                <div class="detail-item">
                    <span class="detail-value" id="w-wind"></span>
                    <span class="detail-label">Ветер</span>
                </div>
            </div>
        </div>
    </div>

    <a href="index.html" class="back-link">&larr; Назад на VSKY</a>

    <script>
        const apiKey = 'f31822fd4360a93c9570a7a71aec0739';
        const input = document.getElementById('city-input');
        const btn = document.getElementById('search-btn');
        const info = document.getElementById('weather-info');
        const errorMsg = document.getElementById('error-msg');
        
        const wIcon = document.getElementById('w-icon');
        const wTemp = document.getElementById('w-temp');
        const wCity = document.getElementById('w-city');
        const wDesc = document.getElementById('w-desc');
        const wHumidity = document.getElementById('w-humidity');
        const wWind = document.getElementById('w-wind');

        function getCustomIcon(code) {
            if (code >= 200 && code < 300) return 'WeatherRaining.png';
            if (code >= 300 && code < 600) {
                if (code === 500 || code === 501) return 'WeatherRainingSun.png';
                return 'WeatherRaining.png';
            }
            if (code >= 600 && code < 700) return 'WeatherSnowing.png';
            if (code >= 700 && code < 800) return 'WeatherCloudy.png';
            if (code === 800) return 'WeatherCloudySun.png';
            if (code === 801 || code === 802) return 'WeatherCloudySun.png';
            if (code === 803 || code === 804) return 'WeatherCloudy.png';
            return 'WeatherCloudy.png';
        }

        async function fetchWeather(city) {
            try {
                const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric&lang=ru`);
                if (!response.ok) {
                    throw new Error();
                }
                const data = await response.json();
                
                errorMsg.style.display = 'none';
                info.style.display = 'flex';

                wCity.innerText = data.name;
                wTemp.innerHTML = Math.round(data.main.temp) + '&deg;C';
                wDesc.innerText = data.weather[0].description;
                wHumidity.innerText = data.main.humidity + '%';
                wWind.innerText = data.wind.speed + ' м/с';

                const iconName = getCustomIcon(data.weather[0].id);
                wIcon.src = `https://gnusinrat.github.io/assets/${iconName}`;

            } catch (err) {
                info.style.display = 'none';
                errorMsg.style.display = 'block';
            }
        }

        btn.addEventListener('click', () => {
            if (input.value.trim() !== '') {
                fetchWeather(input.value.trim());
            }
        });

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && input.value.trim() !== '') {
                fetchWeather(input.value.trim());
            }
        });

        window.onload = () => {
            fetchWeather('Тюмень');
        };
    </script>
</body>
</html>
