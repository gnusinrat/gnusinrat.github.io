<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link class="icon-link" rel="icon" type="image/png" href="https://gnusinrat.github.io/assets/Annoying_Winnie_overworld1.png">
    <title>ветеркомм</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            text-transform: lowercase;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #fff;
            overflow-x: hidden;
            overflow-y: auto;
        }
        .parallax-bg {
            position: fixed;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            background-size: cover;
            background-position: center;
            z-index: -1;
            transition: background-image 0.5s ease;
            pointer-events: none;
        }
        .header {
            margin-bottom: 30px;
            margin-top: 20px;
        }
        .logo {
            max-width: 250px;
            height: auto;
            display: block;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }
        .weather-app {
            background: transparent;
            border: none;
            padding: 20px 10px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            position: relative;
            z-index: 1;
        }
        .search-container {
            position: relative;
            width: 100%;
            margin-bottom: 30px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        .search-box input {
            flex: 1;
            min-width: 0;
            padding: 15px 20px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-size: 1.1rem;
            outline: none;
            transition: 0.2s;
            backdrop-filter: blur(5px);
        }
        .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
        .search-box input:focus {
            border-color: #fff;
            background: rgba(0, 0, 0, 0.7);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }
        .search-box button {
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            padding: 0 20px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
            backdrop-filter: blur(5px);
            flex-shrink: 0;
        }
        .search-box button:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .suggestions {
            position: absolute;
            top: 110%;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            list-style: none;
            overflow: hidden;
            z-index: 10;
            text-align: left;
            display: none;
        }
        .suggestions li {
            padding: 12px 20px;
            cursor: pointer;
            color: #fff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            transition: 0.2s;
        }
        .suggestions li:last-child {
            border-bottom: none;
        }
        .suggestions li:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .weather-info {
            display: none;
            flex-direction: column;
            align-items: center;
        }
        .weather-icon {
            width: 160px;
            height: 160px;
            margin-bottom: 20px;
            border: 2px solid #fff;
            border-radius: 50%;
            padding: 30px;
            background: transparent;
            object-fit: contain;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .temp {
            font-size: 4rem;
            font-weight: 800;
            margin-bottom: 5px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.6);
        }
        .city-name {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 5px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.6);
        }
        .description {
            font-size: 1.2rem;
            color: #fff;
            margin-bottom: 20px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.6);
        }
        .details {
            display: flex;
            justify-content: space-around;
            width: 100%;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
        }
        .detail-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .detail-value {
            font-size: 1.3rem;
            font-weight: 700;
            text-shadow: 0 2px 5px rgba(0,0,0,0.6);
        }
        .detail-label {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
            text-shadow: 0 2px 5px rgba(0,0,0,0.6);
        }
        .error-message {
            display: none;
            color: #ff6b6b;
            font-size: 1.2rem;
            margin-top: 20px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }
        .back-link {
            margin-top: 40px;
            margin-bottom: 40px;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 600;
            font-size: 1.1rem;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 20px;
            transition: 0.2s;
            z-index: 1;
            backdrop-filter: blur(5px);
        }
        .back-link:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="parallax-bg" id="bg-layer"></div>

    <div class="header">
        <img src="https://gnusinrat.github.io/assets/weather/WeatherCommLogo.png" alt="ветеркомм" class="logo" onerror="this.style.display='none'">
    </div>

    <div class="weather-app">
        <div class="search-container">
            <div class="search-box">
                <input type="text" id="city-input" placeholder="введите город...">
                <button id="search-btn">поиск</button>
            </div>
            <ul class="suggestions" id="suggestions"></ul>
        </div>

        <div class="error-message" id="error-msg">город не найден</div>

        <div class="weather-info" id="weather-info">
            <img src="" alt="icon" class="weather-icon" id="w-icon">
            <div class="temp" id="w-temp"></div>
            <div class="city-name" id="w-city"></div>
            <div class="description" id="w-desc"></div>
            
            <div class="details">
                <div class="detail-item">
                    <span class="detail-value" id="w-humidity"></span>
                    <span class="detail-label">влажность</span>
                </div>
                <div class="detail-item">
                    <span class="detail-value" id="w-wind"></span>
                    <span class="detail-label">ветер</span>
                </div>
            </div>
        </div>
    </div>

    <a href="index.html" class="back-link">&larr; назад на vsky</a>

    <script>
        const apiKey = 'f31822fd4360a93c9570a7a71aec0739';
        const input = document.getElementById('city-input');
        const btn = document.getElementById('search-btn');
        const info = document.getElementById('weather-info');
        const errorMsg = document.getElementById('error-msg');
        const suggestionsBox = document.getElementById('suggestions');
        const bgLayer = document.getElementById('bg-layer');
        
        const wIcon = document.getElementById('w-icon');
        const wTemp = document.getElementById('w-temp');
        const wCity = document.getElementById('w-city');
        const wDesc = document.getElementById('w-desc');
        const wHumidity = document.getElementById('w-humidity');
        const wWind = document.getElementById('w-wind');

        let timeoutId;

        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.clientX) / 40;
            const y = (window.innerHeight / 2 - e.clientY) / 40;
            bgLayer.style.transform = `translate(${x}px, ${y}px)`;
        });

        function getCustomIconAndBg(code) {
            let icon = 'WeatherCloudy.png';
            let bg = 'WeatherBGcloudy.jpg';

            if (code >= 200 && code < 600) {
                if (code === 500 || code === 501) icon = 'WeatherRainingSun.png';
                else icon = 'WeatherRaining.png';
                bg = 'WeatherBGraining.jpg';
            } else if (code >= 600 && code < 700) {
                icon = 'WeatherSnowing.png';
                bg = 'WeatherBGcloudy.jpg';
            } else if (code >= 700 && code < 800) {
                icon = 'WeatherCloudy.png';
                bg = 'WeatherBGcloudy.jpg';
            } else if (code === 800) {
                icon = 'WeatherSunny.png';
                bg = 'WeatherBGsunny.jpg';
            } else if (code === 801 || code === 802) {
                icon = 'WeatherCloudySun.png';
                bg = 'WeatherBGcloudy.jpg';
            } else if (code > 802) {
                icon = 'WeatherCloudy.png';
                bg = 'WeatherBGcloudy.jpg';
            }

            return { icon, bg };
        }

        async function fetchWeather(query, isCoords = false) {
            try {
                let url = '';
                if (isCoords) {
                    url = `https://api.openweathermap.org/data/2.5/weather?lat=${query.lat}&lon=${query.lon}&appid=${apiKey}&units=metric&lang=ru`;
                } else {
                    url = `https://api.openweathermap.org/data/2.5/weather?q=${query}&appid=${apiKey}&units=metric&lang=ru`;
                }

                const response = await fetch(url);
                if (!response.ok) throw new Error();
                const data = await response.json();
                
                errorMsg.style.display = 'none';
                info.style.display = 'flex';
                suggestionsBox.style.display = 'none';
                input.value = '';

                wCity.innerText = `${data.name}, ${data.sys.country}`;
                wTemp.innerHTML = Math.round(data.main.temp) + '&deg;c';
                wDesc.innerText = data.weather[0].description;
                wHumidity.innerText = data.main.humidity + '%';
                wWind.innerText = data.wind.speed + ' м/с';

                const media = getCustomIconAndBg(data.weather[0].id);
                wIcon.src = `https://gnusinrat.github.io/assets/weather/${media.icon}`;
                bgLayer.style.backgroundImage = `url('https://gnusinrat.github.io/assets/weather/${media.bg}')`;

                const locString = `${data.name.toLowerCase()}_${data.sys.country.toLowerCase()}`;
                history.pushState(null, '', `?loc=${locString}`);

            } catch (err) {
                info.style.display = 'none';
                errorMsg.style.display = 'block';
                suggestionsBox.style.display = 'none';
            }
        }

        async function fetchSuggestions(query) {
            if (!query) {
                suggestionsBox.style.display = 'none';
                return;
            }
            try {
                const response = await fetch(`https://api.openweathermap.org/geo/1.0/direct?q=${query}&limit=5&appid=${apiKey}`);
                const data = await response.json();
                
                suggestionsBox.innerHTML = '';
                if (data.length > 0) {
                    data.forEach(item => {
                        const li = document.createElement('li');
                        const localName = (item.local_names && item.local_names.ru) ? item.local_names.ru : item.name;
                        li.innerText = `${localName}, ${item.country}`;
                        li.onclick = () => fetchWeather({ lat: item.lat, lon: item.lon }, true);
                        suggestionsBox.appendChild(li);
                    });
                    suggestionsBox.style.display = 'block';
                } else {
                    suggestionsBox.style.display = 'none';
                }
            } catch (err) {
                suggestionsBox.style.display = 'none';
            }
        }

        input.addEventListener('input', (e) => {
            clearTimeout(timeoutId);
            timeoutId = setTimeout(() => {
                fetchSuggestions(e.target.value.trim());
            }, 300);
        });

        btn.addEventListener('click', () => {
            if (input.value.trim() !== '') {
                fetchWeather(input.value.trim());
            }
        });

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && input.value.trim() !== '') {
                fetchWeather(input.value.trim());
            }
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-container')) {
                suggestionsBox.style.display = 'none';
            }
        });

        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const locParam = urlParams.get('loc');

            if (locParam) {
                fetchWeather(locParam.replace('_', ','));
            } else {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            fetchWeather({ lat: position.coords.latitude, lon: position.coords.longitude }, true);
                        },
                        () => {
                            fetchWeather('тюмень');
                        }
                    );
                } else {
                    fetchWeather('тюмень');
                }
            }
        };
    </script>
</body>
</html>
