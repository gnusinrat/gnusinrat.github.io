<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница не найдена — 404</title>
    <style>
        /* Общие стили для центрирования */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f5; /* Светло-серый фон */
            color: #3f3f46; /* Темно-серый текст */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 500px;
            padding: 20px;
        }

        /* Стиль огромной ошибки 404 */
        h1 {
            font-size: 6rem;
            margin: 0;
            font-weight: 700;
            color: #71717a; /* Средне-серый цвет для цифр */
            line-height: 1;
        }

        /* Описание ошибки */
        h2 {
            font-size: 1.5rem;
            margin: 15px 0 10px 0;
            font-weight: 600;
        }

        p {
            font-size: 1rem;
            color: #a1a1aa; /* Чуть более светлый текст для пояснения */
            margin-bottom: 30px;
        }

        /* Серая минималистичная кнопка */
        .btn {
            display: inline-block;
            text-decoration: none;
            background-color: #27272a; /* Темный графит */
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 500;
            transition: background-color 0.2s ease;
        }

        /* Эффект при наведении на кнопку */
        .btn:hover {
            background-color: #52525b; /* Становится чуть светлее */
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>404</h1>
        <h2>ничегошеньки</h2>
        <p>эта ссылка не работает</p>
        <a href="https://gnusinrat.github.io/index" class="btn">На главную</a>
    </div>

</body>
</html>
