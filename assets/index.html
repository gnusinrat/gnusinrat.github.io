<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>VSKY ASSETS</title>
    <link rel="icon" type="image/png" href="https://gnusinrat.github.io/assets/dog.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --dr-bg: #000000;
            --dr-grid-front: rgba(180, 0, 255, 0.5);
            --dr-grid-back: rgba(180, 0, 255, 0.15);
            --dr-text: #ffffff;
            --dr-border: #ffffff;
            --dr-accent: #00ffff;
            --dr-pink: #ff00ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        @keyframes gridMoveFront {
            0% { background-position: 0 0; }
            100% { background-position: -40px -40px; }
        }
        
        @keyframes gridMoveBack {
            0% { background-position: 0 0; }
            100% { background-position: 30px -30px; }
        }

        body {
            background-color: var(--dr-bg);
            background-image: 
                linear-gradient(var(--dr-grid-front) 2px, transparent 2px),
                linear-gradient(90deg, var(--dr-grid-front) 2px, transparent 2px);
            background-size: 40px 40px;
            animation: gridMoveFront 1.5s linear infinite;
            color: var(--dr-text);
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.2rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: -50px; left: -50px; right: -50px; bottom: -50px;
            z-index: -1;
            background-image: 
                linear-gradient(var(--dr-grid-back) 2px, transparent 2px),
                linear-gradient(90deg, var(--dr-grid-back) 2px, transparent 2px);
            background-size: 30px 30px;
            animation: gridMoveBack 2.5s linear infinite;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
            z-index: 10;
        }

        .dr-box {
            background-color: #000;
            border: 4px solid var(--dr-border);
            padding: 20px;
            box-shadow: 0 0 10px rgba(255,255,255,0.2);
            position: relative;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.8rem;
            color: var(--dr-text);
            line-height: 1.4;
            text-shadow: 2px 2px 0px var(--dr-pink);
        }

        .nav-link {
            font-family: 'Press Start 2P', cursive;
            font-size: 1rem;
            color: var(--dr-text);
            text-decoration: none;
            background-color: #000;
            border: 2px solid var(--dr-border);
            padding: 10px;
            transition: 0.1s;
        }

        .nav-link:hover {
            border-color: var(--dr-cyan);
            color: var(--dr-cyan);
            box-shadow: 0 0 10px var(--dr-cyan);
        }

        .assets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .asset-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            background: #000;
            border: 4px solid var(--dr-border);
            padding: 15px;
            text-decoration: none;
            transition: 0.2s;
            cursor: pointer;
        }

        .asset-card:hover {
            border-color: var(--dr-cyan);
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
            z-index: 5;
        }

        .asset-card:hover .asset-name {
            color: var(--dr-cyan);
        }

        .asset-img {
            max-width: 100%;
            max-height: 150px;
            object-fit: contain;
            image-rendering: pixelated;
            margin-bottom: 15px;
        }

        .asset-name {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1rem;
            color: var(--dr-pink);
            word-break: break-all;
            text-align: center;
            transition: 0.2s;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            font-family: 'Press Start 2P', cursive;
            color: #aaa;
            padding: 40px;
            line-height: 1.5;
        }

        @media (max-width: 600px) {
            .header-top {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .assets-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="dr-box header-top">
            <div>
                <h1 style="font-family: 'Share Tech Mono', monospace; font-size: 1rem; color: var(--dr-cyan); text-shadow: none; margin-bottom: 5px;">[ СИСТЕМА ФАЙЛОВ ]</h1>
                <h1>БРАУЗЕР АССЕТОВ VSKY</h1>
            </div>
            <a href="../index.html" class="nav-link">&lt; НА ГЛАВНУЮ</a>
        </header>

        <div class="assets-grid" id="assets-container">
        </div>
    </div>

    <script>
        const files = [
            "dog.png",
            "KnightHead.png",
            "glukia.png",
            "cooler.png",
            "rabbit1.jpg",
            "rabbit2.jpg",
            "rabbit3.jpg",
            "rabbit4.jpg",
            "rabbit5.jpg",
            "cat1.jpg",
            "cat2.jpg",
            "cat3.jpg",
            "cat4.jpg",
            "cat5.jpg",
            "bsod.png",
            "bsod_active.png",
            "apple.jpg",
            "SOUL_battle.png",
            "kretinknight.png",

        ];

        const baseURL = "https://gnusinrat.github.io/assets/";

        const container = document.getElementById('assets-container');

        if (files.length === 0) {
            container.innerHTML = '<div class="empty-state dr-box">* АССЕТЫ НЕ НАЙДЕНЫ.</div>';
        } else {
            files.forEach(file => {
                const url = baseURL + file;
                const card = document.createElement('a');
                card.className = 'asset-card';
                card.href = url;
                card.target = '_blank';
                card.rel = 'noopener noreferrer';

                const img = document.createElement('img');
                img.className = 'asset-img';
                img.src = url;
                img.alt = file;
                img.onerror = function() {
                    this.src = 'https://gnusinrat.github.io/assets/SOUL_battle.png';
                };

                const name = document.createElement('div');
                name.className = 'asset-name';
                name.innerText = file;

                card.appendChild(img);
                card.appendChild(name);
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
