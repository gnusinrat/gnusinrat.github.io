<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>VSKY</title>
    <link rel="icon" type="image/png" href="https://gnusinrat.github.io/assets/catbar_head_big.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --dr-bg: #000000;
            --dr-grid-front: rgba(180, 0, 255, 0.5); /* Яркая передняя сетка */
            --dr-grid-back: rgba(180, 0, 255, 0.15); /* Тусклая задняя сетка */
            --dr-text: #ffffff;
            --dr-border: #ffffff;
            --dr-accent: #00ffff;
            --dr-pink: #ff00ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Анимации для двойного фона битвы */
        @keyframes gridMoveFront {
            0% { background-position: 0 0; }
            100% { background-position: -40px -40px; }
        }
        
        @keyframes gridMoveBack {
            0% { background-position: 0 0; }
            100% { background-position: 30px -30px; } /* Движется в другую сторону */
        }

        body {
            background-color: var(--dr-bg);
            /* Передняя сетка */
            background-image: 
                linear-gradient(var(--dr-grid-front) 2px, transparent 2px),
                linear-gradient(90deg, var(--dr-grid-front) 2px, transparent 2px);
            background-size: 40px 40px;
            animation: gridMoveFront 1.5s linear infinite;
            
            color: var(--dr-text);
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.2rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Задняя тусклая сетка */
        body::before {
            content: "";
            position: fixed;
            top: -50px; left: -50px; right: -50px; bottom: -50px;
            z-index: -1;
            background-image: 
                linear-gradient(var(--dr-grid-back) 2px, transparent 2px),
                linear-gradient(90deg, var(--dr-grid-back) 2px, transparent 2px);
            background-size: 30px 30px; /* Чуть мельче для эффекта перспективы */
            animation: gridMoveBack 2.5s linear infinite;
            pointer-events: none;
        }

        /* Кнопка смены языка в углу */
        #lang-switch-corner {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #000;
            border: 2px solid var(--dr-border);
            color: var(--dr-text);
            font-family: 'Press Start 2P', cursive;
            font-size: 0.8rem;
            padding: 10px 15px;
            cursor: pointer;
            z-index: 100;
            transition: 0.1s;
        }

        #lang-switch-corner:hover {
            border-color: var(--dr-accent);
            color: var(--dr-accent);
            box-shadow: 0 0 10px var(--dr-accent);
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 40px; /* Сдвиг вниз из-за кнопки языка */
            z-index: 10;
        }

        .dr-box {
            background-color: #000;
            border: 4px solid var(--dr-border);
            padding: 20px;
            box-shadow: 0 0 10px rgba(255,255,255,0.2);
            position: relative;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 2rem;
            color: var(--dr-text);
            line-height: 1.4;
            text-shadow: 2px 2px 0px #ff00ff;
        }

        .act-btn {
            font-family: 'Press Start 2P', cursive;
            font-size: 1rem;
            color: var(--dr-text);
            background: #000;
            border: 4px solid var(--dr-border);
            padding: 10px 15px;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.1s;
        }

        .act-btn:hover {
            border-color: var(--dr-accent);
            color: var(--dr-accent);
            box-shadow: 0 0 15px var(--dr-accent);
        }

        .dialogue-box {
            font-size: 1.3rem;
            line-height: 1.6;
            min-height: 100px;
            display: flex;
            align-items: flex-start;
            gap: 15px;
        }

        @keyframes starBop {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
        
        .dialogue-star {
            font-family: 'Press Start 2P', cursive;
            animation: starBop 1s steps(2, end) infinite;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }

        .card {
            background: #000;
            border: 4px solid var(--dr-border);
            color: var(--dr-text);
            text-decoration: none;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: 0.1s;
            position: relative;
        }

        .card-content {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .card-title {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.1rem;
            line-height: 1.3;
        }

        .card-desc {
            color: #aaa;
            font-size: 1rem;
        }

        /* Новая иконка души */
        .soul-icon {
            width: 18px;
            height: auto;
            opacity: 0; 
            transition: opacity 0.1s;
            flex-shrink: 0;
            image-rendering: pixelated; /* Сохраняет четкость пикселей */
        }

        .card:hover {
            border-color: var(--dr-pink);
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.5);
            transform: scale(1.02);
            z-index: 5;
        }

        .card:hover .soul-icon { opacity: 1; }
        .card:hover .card-title { color: var(--dr-pink); }

        /* Кулер в левом нижнем углу */
        #corner-cooler {
            position: fixed;
            bottom: 20px;
            left: 20px;
            transition: transform 0.2s ease-in-out, filter 0.2s ease;
            cursor: pointer;
            z-index: 100;
        }

        #corner-cooler:hover {
            transform: scale(1.1);
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.3));
        }

        #corner-cooler img {
            width: 90px;
            height: auto;
            image-rendering: pixelated;
        }

        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--dr-bg);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
        }

        @keyframes pulseSoul {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .loading-soul {
            width: 30px;
            animation: pulseSoul 1s infinite;
            image-rendering: pixelated;
        }

        .running-dog {
            position: fixed;
            top: 50%;
            right: -100px;
            transform: translateY(-50%);
            width: 80px;
            height: 80px;
            background-image: url('https://gnusinrat.github.io/assets/dog.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            image-rendering: pixelated;
            z-index: 9999;
            pointer-events: none;
            animation: dogMove 5s linear infinite, dogFrames 0.2s steps(1) infinite;
        }

        @keyframes dogMove {
            0% { right: -100px; }
            100% { right: 100vw; }
        }

        @keyframes dogFrames {
            0% { background-image: url('https://gnusinrat.github.io/assets/dog.png'); }
            50% { background-image: url('https://gnusinrat.github.io/assets/dog2.png'); }
            100% { background-image: url('https://gnusinrat.github.io/assets/dog.png'); }
        }

        @media (max-width: 600px) {
            .header-top {
                flex-direction: column;
                align-items: center;
                text-align: center;
                gap: 20px;
            }
            .container { margin-top: 60px; }
            #lang-switch-corner { top: 10px; right: 10px; }
            #corner-cooler img { width: 70px; }
        }
    </style>
</head>
<body>

    <button id="lang-switch-corner">EN</button>

    <div class="running-dog"></div>

    <a href="https://gnusinrat.github.io/rarercats" id="corner-cooler" target="_blank" rel="noopener noreferrer">
        <img src="https://gnusinrat.github.io/assets/cooler.png" alt="Кулер">
    </a>

    <div id="loading-screen">
        <img src="https://gnusinrat.github.io/assets/SOUL_battle.png" class="loading-soul" alt="Loading Soul">
        <div style="font-family: 'Press Start 2P', cursive; color: white;">ЗАГРУЗКА...</div>
    </div>

    <div class="container">
        <div class="dr-box">
            <div class="header-top">
                <h1 id="t-title">чё как?</h1>
                </a>
            </div>
        </div>

        <div class="dr-box dialogue-box">
            <div class="dialogue-star">*</div>
            <span id="t-desc"></span>
        </div>

        <div class="cards">
            <a href="https://gnusinrat.github.io/paint" class="card">
                <img src="https://gnusinrat.github.io/assets/SOUL_battle.png" class="soul-icon" alt="Soul">
                <div class="card-content">
                    <span class="card-title" id="t-htm">HTMPen</span>
                    <span class="card-desc" id="t-htm-desc">Рисовалка с Gemini API</span>
                </div>
            </a>
            
            <a href="https://gnusinrat.github.io/maxclicker" class="card">
                <img src="https://gnusinrat.github.io/assets/SOUL_battle.png" class="soul-icon" alt="Soul">
                <div class="card-content">
                    <span class="card-title">MaxClicker</span>
                    <span class="card-desc" id="t-clicker">Кликер</span>
                </div>
            </a>
            
            <a href="https://badgester.neocities.org" class="card">
                <img src="https://gnusinrat.github.io/assets/SOUL_battle.png" class="soul-icon" alt="Soul">
                <div class="card-content">
                    <span class="card-title" id="t-old-title">Старый сайт</span>
                    <span class="card-desc" id="t-old-desc">Архив на Neocities</span>
                </div>
            </a>
            
            <a href="https://gnusinrat.github.io/top" class="card">
                <img src="https://gnusinrat.github.io/assets/SOUL_battle.png" class="soul-icon" alt="Soul">
                <div class="card-content">
                    <span class="card-title" id="t-top-title">Мои топы</span>
                    <span class="card-desc" id="t-top-desc">Любимые блюда и животные</span>
                </div>
            </a>
            
            <a href="https://gnusinrat.github.io/rabbits" class="card">
                <img src="https://gnusinrat.github.io/assets/SOUL_battle.png" class="soul-icon" alt="Soul">
                <div class="card-content">
                    <span class="card-title" id="t-rab-title">Кролики</span>
                    <span class="card-desc" id="t-rab-desc">кролики</span>
                </div>
            </a>

            <a href="https://gnusinrat.github.io/procedural" class="card">
                <img src="https://gnusinrat.github.io/assets/SOUL_battle.png" class="soul-icon" alt="Soul">
                <div class="card-content">
                    <span class="card-title" id="t-zen-title">дзен</span>
                    <span class="card-desc">💖☮️⚛️</span>
                </div>
            </a>

            <a href="https://gnusinrat.github.io/webmap" class="card">
                <img src="https://gnusinrat.github.io/assets/SOUL_battle.png" class="soul-icon" alt="Soul">
                <div class="card-content">
                    <span class="card-title" id="t-map-title">Карта сайта</span>
                    <span class="card-desc" id="t-map-desc">Визуальная карта всех страниц</span>
                </div>
            </a>
            
            <a href="docs/anomalies/index.html" class="card" id="card-wiki">
                <img src="https://gnusinrat.github.io/assets/SOUL_battle.png" class="soul-icon" alt="Soul">
                <div class="card-content">
                    <span class="card-title">Вики VSKY</span>
                    <span class="card-desc">Секретные архивы</span>
                </div>
            </a>
        </div>
    </div>

    <script>
        const dict = {
            ru: {
                title: "чё как?",
                spotlight: "[ РАДАР ]",
                desc: "новый сайт значкестера/mostlyengineer/пилота. я не буду тратить много времени на эту страницу, так что чекай другие:",
                htm: "HTMPen",
                htmDesc: "Рисовалка с Gemini API",
                clicker: "Кликер",
                oldTitle: "Старый сайт",
                oldDesc: "Архив на Neocities",
                topTitle: "Мои топы",
                topDesc: "Любимые блюда и животные",
                rabTitle: "Кролики",
                rabDesc: "кролики",
                zenTitle: "дзен",
                mapTitle: "Карта сайта",
                mapDesc: "Визуальная карта всех страниц",
                toggleBtn: "EN"
            },
            en: {
                title: "what's up?",
                spotlight: "[ RADAR ]",
                desc: "this is badgester/mostlyengineer/pilot/pilotgc's new website. i'm not going to spend too much time on this page so check out the other pages:",
                htm: "HTMPen",
                htmDesc: "Drawing thing made with Gemini [RU]",
                clicker: "Clicker game",
                oldTitle: "Old Website",
                oldDesc: "Archived on Neocities",
                topTitle: "My Tops",
                topDesc: "Favorite food and animals",
                rabTitle: "Rabbits",
                rabDesc: "rabbits",
                zenTitle: "zen",
                mapTitle: "Sitemap",
                mapDesc: "Visual map of all pages",
                toggleBtn: "RU"
            }
        };

        let currentLang = 'ru'; 
        let typingTimeout;

        function typeWriterEffect(text) {
            const descElement = document.getElementById('t-desc');
            descElement.innerHTML = "";
            clearTimeout(typingTimeout);
            
            let i = 0;
            function typeNext() {
                if (i < text.length) {
                    descElement.innerHTML += text.charAt(i);
                    i++;
                    typingTimeout = setTimeout(typeNext, 30);
                }
            }
            typeNext();
        }

        window.onload = () => {
            const loader = document.getElementById('loading-screen');
            setTimeout(() => {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
                typeWriterEffect(dict[currentLang].desc);
            }, 600); 
        };

        const langBtn = document.getElementById('lang-switch-corner');

        langBtn.addEventListener('click', () => {
            currentLang = currentLang === 'ru' ? 'en' : 'ru';
            
            document.documentElement.lang = currentLang;
            
            langBtn.innerText = dict[currentLang].toggleBtn;
            
            document.getElementById('t-title').innerText = dict[currentLang].title;
            document.getElementById('t-spotlight').innerText = dict[currentLang].spotlight;
            typeWriterEffect(dict[currentLang].desc);

            document.getElementById('t-htm').innerText = dict[currentLang].htm;
            document.getElementById('t-htm-desc').innerText = dict[currentLang].htmDesc;
            document.getElementById('t-clicker').innerText = dict[currentLang].clicker;
            document.getElementById('t-old-title').innerText = dict[currentLang].oldTitle;
            document.getElementById('t-old-desc').innerText = dict[currentLang].oldDesc;
            document.getElementById('t-top-title').innerText = dict[currentLang].topTitle;
            document.getElementById('t-top-desc').innerText = dict[currentLang].topDesc;
            document.getElementById('t-rab-title').innerText = dict[currentLang].rabTitle;
            document.getElementById('t-rab-desc').innerText = dict[currentLang].rabDesc;
            document.getElementById('t-zen-title').innerText = dict[currentLang].zenTitle;
            document.getElementById('t-map-title').innerText = dict[currentLang].mapTitle;
            document.getElementById('t-map-desc').innerText = dict[currentLang].mapDesc;

            document.getElementById('card-wiki').style.display = currentLang === 'ru' ? 'flex' : 'none';
        });
    </script>
</body>
</html>
