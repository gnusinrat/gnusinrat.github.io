<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>VSKY</title>
    <!-- Подключаем Teko для заголовков и Roboto для текста -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Teko:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --tf-bg-dark: #2A2725;
            --tf-bg-panel: #3B3631;
            --tf-bg-paper: #EAE3C8;
            --tf-border-dark: #1D1B1A;
            --tf-border-paper: #8A7C6B;
            
            --tf-text-light: #EBE2CA;
            --tf-text-dark: #2A2725;
            
            --tf-red: #B8383B;
            --tf-blu: #5885A2;
            --tf-ylw: #E7B53B;
            --tf-grn: #3B8A3C;
        }

        /* Экран загрузки */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--tf-bg-dark);
            background-image: radial-gradient(circle at center, #3c3732 0%, #2A2725 100%);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
        }

        .tf-spinner {
            width: 100px;
            height: 100px;
            animation: spin 1.5s linear infinite;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--tf-bg-dark);
            background-image: radial-gradient(circle at center, #3c3732 0%, #2A2725 100%);
            color: var(--tf-text-light);
            font-family: 'Roboto', sans-serif;
            font-size: 1.1rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
        }

        .tf-panel {
            background-color: var(--tf-bg-panel);
            border: 4px solid var(--tf-border-dark);
            border-radius: 8px;
            padding: 20px;
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.05), 0 4px 10px rgba(0,0,0,0.5);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-subtitle {
            font-family: 'Roboto', sans-serif;
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 5px;
            font-weight: bold;
            text-transform: uppercase;
        }

        h1 {
            font-family: 'Teko', sans-serif;
            font-size: 3.5rem;
            color: var(--tf-text-light);
            text-transform: uppercase;
            text-shadow: 2px 2px 0px #000, 4px 4px 0px rgba(0,0,0,0.5);
            line-height: 1;
            letter-spacing: 1px;
        }

        .act-btn {
            font-family: 'Teko', sans-serif;
            font-size: 1.8rem;
            letter-spacing: 1px;
            color: var(--tf-text-light);
            background: #504841;
            border: 2px solid var(--tf-border-dark);
            border-radius: 4px;
            padding: 5px 20px;
            cursor: pointer;
            text-decoration: none;
            transition: 0.1s;
            text-shadow: 1px 1px 0px #000;
            box-shadow: inset 0 2px 2px rgba(255,255,255,0.1), 0 2px 4px rgba(0,0,0,0.3);
            display: inline-block;
        }

        .act-btn:hover {
            background: var(--tf-ylw);
            color: var(--tf-border-dark);
            text-shadow: none;
        }

        .dialogue-box {
            font-size: 1.2rem;
            line-height: 1.5;
            min-height: 80px;
            background: rgba(0,0,0,0.2);
            border: 2px dashed rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 4px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }

        .card {
            background: linear-gradient(180deg, #6a6259 0%, #453e38 100%);
            border: 4px solid var(--tf-border-dark);
            border-top-color: #8c8277;
            border-left-color: #7a7268;
            border-radius: 6px;
            color: var(--tf-text-light);
            text-decoration: none;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            transition: 0.1s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5), inset 0 -2px 5px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            border-color: var(--tf-ylw);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.6), inset 0 -2px 5px rgba(0,0,0,0.3);
            background: linear-gradient(180deg, #7d746a 0%, #544c45 100%);
        }

        .card-title {
            font-family: 'Teko', sans-serif;
            font-size: 2.2rem;
            text-transform: uppercase;
            line-height: 1;
            font-weight: 600;
            text-shadow: 1px 1px 0px #000;
        }

        .card:hover .card-title {
            color: var(--tf-ylw);
        }

        .card-desc {
            font-size: 1.05rem;
            color: #b5ac9d;
            font-weight: bold;
        }

        .lang-card {
            background: linear-gradient(180deg, #3B3631 0%, #1D1B1A 100%);
            border-color: #1D1B1A;
            border-top-color: #4A443E;
            border-left-color: #4A443E;
        }

        .lang-card .card-desc { color: #888; }

        .lang-card:hover {
            background: var(--tf-ylw);
            border-color: var(--tf-border-dark);
            color: var(--tf-border-dark);
        }
        
        .lang-card:hover .card-title { color: var(--tf-border-dark); text-shadow: none; }
        .lang-card:hover .card-desc { color: #333; }

        @media (max-width: 600px) {
            .header-top {
                flex-direction: column;
                align-items: center;
                text-align: center;
                gap: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- ЭКРАН ЗАГРУЗКИ -->
    <div id="loading-screen">
        <img src="https://file.garden/aUk_YK3Gbmwc6_an/tf.png" alt="Loading..." class="tf-spinner">
    </div>

    <div class="container">
        <div class="tf-panel">
            <div class="header-top">
                <div>
                    <div class="header-subtitle">[ ДОСЬЕ / MANN CO. ]</div>
                    <h1 id="t-title">чё как?</h1>
                </div>
                <a href="spotlight.html" class="act-btn" title="VSKY Spotlight">
                    РАДАР &raquo;
                </a>
            </div>
        </div>

        <div class="dialogue-box">
            <span id="t-desc"></span>
        </div>

        <div class="cards">
            <a href="https://gnusinrat.github.io/paint" class="card">
                <span class="card-title" id="t-htm">HTMPen</span>
                <span class="card-desc" id="t-htm-desc">Рисовалка с Gemini API</span>
            </a>
            
            <a href="https://gnusinrat.github.io/maxclicker" class="card">
                <span class="card-title">MaxClicker</span>
                <span class="card-desc" id="t-clicker">Кликер</span>
            </a>
            
            <a href="https://badgester.neocities.org" class="card">
                <span class="card-title" id="t-old-title">Старый сайт</span>
                <span class="card-desc" id="t-old-desc">Архив на Neocities</span>
            </a>
            
            <a href="https://gnusinrat.github.io/top" class="card">
                <span class="card-title" id="t-top-title">Мои топы</span>
                <span class="card-desc" id="t-top-desc">Любимые блюда и животные</span>
            </a>
            
            <a href="https://gnusinrat.github.io/rabbits" class="card">
                <span class="card-title" id="t-rab-title">Кролики</span>
                <span class="card-desc" id="t-rab-desc">кролики</span>
            </a>

            <a href="https://gnusinrat.github.io/procedural" class="card">
                <span class="card-title" id="t-zen-title">дзен</span>
                <span class="card-desc">💖☮️⚛️</span>
            </a>

            <a href="https://gnusinrat.github.io/webmap" class="card">
                <span class="card-title" id="t-map-title">Карта сайта</span>
                <span class="card-desc" id="t-map-desc">Визуальная карта всех страниц</span>
            </a>

            <!-- LANGUAGE SWITCHER -->
            <a href="#" class="card lang-card" id="lang-switch">
                <span class="card-title" id="t-lang-title">US English</span>
                <span class="card-desc" id="t-lang-desc">Switch to English</span>
            </a>
        </div>
    </div>

    <script>
        const dict = {
            ru: {
                title: "чё как?",
                desc: "> новый сайт значкестера/mostlyengineer/пилота. я не буду тратить много времени на эту страницу, так что чекай другие:",
                htm: "HTMPen",
                htmDesc: "Рисовалка с Gemini API",
                clicker: "Кликер",
                oldTitle: "Старый сайт",
                oldDesc: "Архив на Neocities",
                topTitle: "Мои топы",
                topDesc: "Любимые блюда и животные",
                rabTitle: "Кролики",
                rabDesc: "кролики",
                zenTitle: "дзен",
                mapTitle: "Карта сайта",
                mapDesc: "Визуальная карта всех страниц",
                langTitle: "US English",
                langDesc: "Switch to English"
            },
            en: {
                title: "what's up?",
                desc: "> this is badgester/mostlyengineer/pilot/pilotgc's new website. i'm not going to spend too much time on this page so check out the other pages:",
                htm: "HTMPen",
                htmDesc: "Drawing thing made with Gemini [RU]",
                clicker: "Clicker game",
                oldTitle: "Old Website",
                oldDesc: "Archived on Neocities",
                topTitle: "My Tops",
                topDesc: "Favorite food and animals",
                rabTitle: "Rabbits",
                rabDesc: "rabbits",
                zenTitle: "zen",
                mapTitle: "Sitemap",
                mapDesc: "Visual map of all pages",
                langTitle: "🇷🇺 Русская версия",
                langDesc: "Поменять на русский"
            }
        };

        let currentLang = 'ru'; 
        let typingTimeout;

        function typeWriterEffect(text) {
            const descElement = document.getElementById('t-desc');
            descElement.innerHTML = "";
            clearTimeout(typingTimeout);
            
            let i = 0;
            function typeNext() {
                if (i < text.length) {
                    descElement.innerHTML += text.charAt(i);
                    i++;
                    // Задержка имитирует печатную машинку или терминал
                    typingTimeout = setTimeout(typeNext, 20);
                }
            }
            typeNext();
        }

        // Запуск при первой загрузке
        window.onload = () => {
            // Прячем экран загрузки
            const loader = document.getElementById('loading-screen');
            setTimeout(() => {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
                
                // Начинаем эффект печати после скрытия загрузки
                typeWriterEffect(dict[currentLang].desc);
            }, 800); // Небольшая задержка, чтобы логотип успел покрутиться (можно поменять)
        };

        const langBtn = document.getElementById('lang-switch');

        langBtn.addEventListener('click', (e) => {
            e.preventDefault();
            
            currentLang = currentLang === 'ru' ? 'en' : 'ru';
            
            document.documentElement.lang = currentLang;
            document.title = currentLang === 'ru' ? "badgester's directory" : "badgester's directory";
            
            document.getElementById('t-title').innerText = dict[currentLang].title;
            
            // Запускаем эффект печати для нового языка
            typeWriterEffect(dict[currentLang].desc);

            document.getElementById('t-htm').innerText = dict[currentLang].htm;
            document.getElementById('t-htm-desc').innerText = dict[currentLang].htmDesc;
            document.getElementById('t-clicker').innerText = dict[currentLang].clicker;
            document.getElementById('t-old-title').innerText = dict[currentLang].oldTitle;
            document.getElementById('t-old-desc').innerText = dict[currentLang].oldDesc;
            document.getElementById('t-top-title').innerText = dict[currentLang].topTitle;
            document.getElementById('t-top-desc').innerText = dict[currentLang].topDesc;
            document.getElementById('t-rab-title').innerText = dict[currentLang].rabTitle;
            document.getElementById('t-rab-desc').innerText = dict[currentLang].rabDesc;
            document.getElementById('t-zen-title').innerText = dict[currentLang].zenTitle;
            document.getElementById('t-map-title').innerText = dict[currentLang].mapTitle;
            document.getElementById('t-map-desc').innerText = dict[currentLang].mapDesc;
            
            document.getElementById('t-lang-title').innerText = dict[currentLang].langTitle;
            document.getElementById('t-lang-desc').innerText = dict[currentLang].langDesc;
        });
    </script>
</body>
</html>
