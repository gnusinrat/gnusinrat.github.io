<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>VSKY</title>
    
    <!-- Подключаем пиксельный шрифт для заголовков и читабельный для текста -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --dr-bg: #000000;
            --dr-grid: rgba(180, 0, 255, 0.4);
            --dr-text: #ffffff;
            --dr-border: #ffffff;
            --dr-accent: #00ffff; /* Циановый (Крис) */
            --dr-pink: #ff00ff; /* Неоновый розовый */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Движущаяся фиолетовая сетка Cyber Field */
        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: -40px -40px; }
        }

        body {
            background-color: var(--dr-bg);
            /* Отрисовка пиксельной сетки */
            background-image: 
                linear-gradient(var(--dr-grid) 2px, transparent 2px),
                linear-gradient(90deg, var(--dr-grid) 2px, transparent 2px);
            background-size: 40px 40px;
            animation: gridMove 2s linear infinite;
            
            color: var(--dr-text);
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.2rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
            z-index: 10; /* Поверх сетки */
        }

        /* Стиль окон диалогов из Deltarune */
        .dr-box {
            background-color: #000;
            border: 4px solid var(--dr-border);
            padding: 20px;
            box-shadow: 0 0 10px rgba(255,255,255,0.2);
            position: relative;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 2rem;
            color: var(--dr-text);
            line-height: 1.4;
            text-shadow: 2px 2px 0px #ff00ff;
        }

        .act-btn {
            font-family: 'Press Start 2P', cursive;
            font-size: 1rem;
            color: var(--dr-text);
            background: #000;
            border: 4px solid var(--dr-border);
            padding: 10px 15px;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.1s;
        }

        .act-btn:hover {
            border-color: var(--dr-accent);
            color: var(--dr-accent);
            box-shadow: 0 0 15px var(--dr-accent);
        }

        .dialogue-box {
            font-size: 1.3rem;
            line-height: 1.6;
            min-height: 100px;
            display: flex;
            align-items: flex-start;
            gap: 15px;
        }

        /* Анимация звездочки текста */
        @keyframes starBop {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
        
        .dialogue-star {
            font-family: 'Press Start 2P', cursive;
            animation: starBop 1s steps(2, end) infinite;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }

        /* Карточки */
        .card {
            background: #000;
            border: 4px solid var(--dr-border);
            color: var(--dr-text);
            text-decoration: none;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: 0.1s;
            position: relative;
        }

        .card-content {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .card-title {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.1rem;
            line-height: 1.3;
        }

        .card-desc {
            color: #aaa;
            font-size: 1rem;
        }

        /* Иконка души внутри кнопок */
        .soul-icon {
            width: 24px;
            height: 24px;
            opacity: 0; /* Скрыта по умолчанию */
            transition: opacity 0.1s;
            flex-shrink: 0;
        }

        .card:hover {
            border-color: var(--dr-pink);
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.5);
            transform: scale(1.02);
            z-index: 5;
        }

        .card:hover .soul-icon {
            opacity: 1; /* Показываем Душу */
        }
        
        .card:hover .card-title {
            color: var(--dr-pink);
        }

        .lang-card {
            border-color: #555;
        }

        /* Экран загрузки */
        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--dr-bg);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
        }

        @keyframes pulseSoul {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .loading-soul {
            width: 50px;
            height: 50px;
            animation: pulseSoul 1s infinite;
        }

        @media (max-width: 600px) {
            .header-top {
                flex-direction: column;
                align-items: center;
                text-align: center;
                gap: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- ЭКРАН ЗАГРУЗКИ (Пульсирующая Душа) -->
    <div id="loading-screen">
        <svg class="loading-soul" viewBox="0 0 16 16" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="2" width="4" height="2" fill="red"/>
            <rect x="10" y="2" width="4" height="2" fill="red"/>
            <rect x="0" y="4" width="16" height="4" fill="red"/>
            <rect x="2" y="8" width="12" height="2" fill="red"/>
            <rect x="4" y="10" width="8" height="2" fill="red"/>
            <rect x="6" y="12" width="4" height="2" fill="red"/>
            <rect x="7" y="14" width="2" height="2" fill="red"/>
        </svg>
        <div style="font-family: 'Press Start 2P', cursive; color: white;">LOADING...</div>
    </div>

    <!-- ВЕКТОРНАЯ ДУША ДЛЯ КНОПОК (многоразовая) -->
    <svg style="display: none;">
        <symbol id="red-soul" viewBox="0 0 16 16" shape-rendering="crispEdges">
            <rect x="2" y="2" width="4" height="2" fill="red"/>
            <rect x="10" y="2" width="4" height="2" fill="red"/>
            <rect x="0" y="4" width="16" height="4" fill="red"/>
            <rect x="2" y="8" width="12" height="2" fill="red"/>
            <rect x="4" y="10" width="8" height="2" fill="red"/>
            <rect x="6" y="12" width="4" height="2" fill="red"/>
            <rect x="7" y="14" width="2" height="2" fill="red"/>
        </symbol>
    </svg>

    <div class="container">
        <div class="dr-box">
            <div class="header-top">
                <h1 id="t-title">чё как?</h1>
                <a href="spotlight.html" class="act-btn" title="VSKY Spotlight">
                    <svg class="soul-icon" style="opacity: 1;"><use href="#red-soul"></use></svg>
                    [ RADAR ]
                </a>
            </div>
        </div>

        <div class="dr-box dialogue-box">
            <div class="dialogue-star">*</div>
            <span id="t-desc"></span>
        </div>

        <div class="cards">
            <a href="https://gnusinrat.github.io/paint" class="card">
                <svg class="soul-icon"><use href="#red-soul"></use></svg>
                <div class="card-content">
                    <span class="card-title" id="t-htm">HTMPen</span>
                    <span class="card-desc" id="t-htm-desc">Рисовалка с Gemini API</span>
                </div>
            </a>
            
            <a href="https://gnusinrat.github.io/maxclicker" class="card">
                <svg class="soul-icon"><use href="#red-soul"></use></svg>
                <div class="card-content">
                    <span class="card-title">MaxClicker</span>
                    <span class="card-desc" id="t-clicker">Кликер</span>
                </div>
            </a>
            
            <a href="https://badgester.neocities.org" class="card">
                <svg class="soul-icon"><use href="#red-soul"></use></svg>
                <div class="card-content">
                    <span class="card-title" id="t-old-title">Старый сайт</span>
                    <span class="card-desc" id="t-old-desc">Архив на Neocities</span>
                </div>
            </a>
            
            <a href="https://gnusinrat.github.io/top" class="card">
                <svg class="soul-icon"><use href="#red-soul"></use></svg>
                <div class="card-content">
                    <span class="card-title" id="t-top-title">Мои топы</span>
                    <span class="card-desc" id="t-top-desc">Любимые блюда и животные</span>
                </div>
            </a>
            
            <a href="https://gnusinrat.github.io/rabbits" class="card">
                <svg class="soul-icon"><use href="#red-soul"></use></svg>
                <div class="card-content">
                    <span class="card-title" id="t-rab-title">Кролики</span>
                    <span class="card-desc" id="t-rab-desc">кролики</span>
                </div>
            </a>

            <a href="https://gnusinrat.github.io/procedural" class="card">
                <svg class="soul-icon"><use href="#red-soul"></use></svg>
                <div class="card-content">
                    <span class="card-title" id="t-zen-title">дзен</span>
                    <span class="card-desc">💖☮️⚛️</span>
                </div>
            </a>

            <a href="https://gnusinrat.github.io/webmap" class="card">
                <svg class="soul-icon"><use href="#red-soul"></use></svg>
                <div class="card-content">
                    <span class="card-title" id="t-map-title">Карта сайта</span>
                    <span class="card-desc" id="t-map-desc">Визуальная карта всех страниц</span>
                </div>
            </a>

            <!-- LANGUAGE SWITCHER -->
            <a href="#" class="card lang-card" id="lang-switch">
                <svg class="soul-icon"><use href="#red-soul"></use></svg>
                <div class="card-content">
                    <span class="card-title" id="t-lang-title">US English</span>
                    <span class="card-desc" id="t-lang-desc">Switch to English</span>
                </div>
            </a>
        </div>
    </div>

    <script>
        const dict = {
            ru: {
                title: "чё как?",
                desc: "новый сайт значкестера/mostlyengineer/пилота. я не буду тратить много времени на эту страницу, так что чекай другие:",
                htm: "HTMPen",
                htmDesc: "Рисовалка с Gemini API",
                clicker: "Кликер",
                oldTitle: "Старый сайт",
                oldDesc: "Архив на Neocities",
                topTitle: "Мои топы",
                topDesc: "Любимые блюда и животные",
                rabTitle: "Кролики",
                rabDesc: "кролики",
                zenTitle: "дзен",
                mapTitle: "Карта сайта",
                mapDesc: "Визуальная карта всех страниц",
                langTitle: "US English",
                langDesc: "Switch to English"
            },
            en: {
                title: "what's up?",
                desc: "this is badgester/mostlyengineer/pilot/pilotgc's new website. i'm not going to spend too much time on this page so check out the other pages:",
                htm: "HTMPen",
                htmDesc: "Drawing thing made with Gemini [RU]",
                clicker: "Clicker game",
                oldTitle: "Old Website",
                oldDesc: "Archived on Neocities",
                topTitle: "My Tops",
                topDesc: "Favorite food and animals",
                rabTitle: "Rabbits",
                rabDesc: "rabbits",
                zenTitle: "zen",
                mapTitle: "Sitemap",
                mapDesc: "Visual map of all pages",
                langTitle: "🇷🇺 Русская версия",
                langDesc: "Поменять на русский"
            }
        };

        let currentLang = 'ru'; 
        let typingTimeout;

        function typeWriterEffect(text) {
            const descElement = document.getElementById('t-desc');
            descElement.innerHTML = "";
            clearTimeout(typingTimeout);
            
            let i = 0;
            function typeNext() {
                if (i < text.length) {
                    descElement.innerHTML += text.charAt(i);
                    i++;
                    typingTimeout = setTimeout(typeNext, 30); // Скорость печати
                }
            }
            typeNext();
        }

        window.onload = () => {
            const loader = document.getElementById('loading-screen');
            setTimeout(() => {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
                typeWriterEffect(dict[currentLang].desc);
            }, 600); 
        };

        const langBtn = document.getElementById('lang-switch');

        langBtn.addEventListener('click', (e) => {
            e.preventDefault();
            
            currentLang = currentLang === 'ru' ? 'en' : 'ru';
            
            document.documentElement.lang = currentLang;
            document.title = "VSKY";
            
            document.getElementById('t-title').innerText = dict[currentLang].title;
            typeWriterEffect(dict[currentLang].desc);

            document.getElementById('t-htm').innerText = dict[currentLang].htm;
            document.getElementById('t-htm-desc').innerText = dict[currentLang].htmDesc;
            document.getElementById('t-clicker').innerText = dict[currentLang].clicker;
            document.getElementById('t-old-title').innerText = dict[currentLang].oldTitle;
            document.getElementById('t-old-desc').innerText = dict[currentLang].oldDesc;
            document.getElementById('t-top-title').innerText = dict[currentLang].topTitle;
            document.getElementById('t-top-desc').innerText = dict[currentLang].topDesc;
            document.getElementById('t-rab-title').innerText = dict[currentLang].rabTitle;
            document.getElementById('t-rab-desc').innerText = dict[currentLang].rabDesc;
            document.getElementById('t-zen-title').innerText = dict[currentLang].zenTitle;
            document.getElementById('t-map-title').innerText = dict[currentLang].mapTitle;
            document.getElementById('t-map-desc').innerText = dict[currentLang].mapDesc;
            
            document.getElementById('t-lang-title').innerText = dict[currentLang].langTitle;
            document.getElementById('t-lang-desc').innerText = dict[currentLang].langDesc;
        });
    </script>
</body>
</html>
