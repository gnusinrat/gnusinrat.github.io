<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>awesomeindu</title>
    <link class="icon-link" rel="icon" type="image/png" href="https://gnusinrat.github.io/assets/Annoying_Winnie_overworld1.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --dr-bg: #111111;
            --dr-text: #dddddd;
            --dr-border: #555555;
            --dr-accent: #888888;
            --btn-osu: #ff66aa;
            --btn-bsky: #0088ff;
            --btn-steam: #222222;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: var(--dr-bg);
            color: var(--dr-text);
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.2rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }
        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 40px;
            z-index: 10;
        }
        .dr-box {
            background-color: #1a1a1a;
            border: 4px solid var(--dr-border);
            padding: 30px;
            position: relative;
            text-align: center;
        }
        .header-text {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.2rem;
            color: var(--dr-text);
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .marquee-container {
            width: 100%;
            overflow: hidden;
            background: #000;
            border: 2px solid var(--dr-border);
            padding: 10px 0;
            margin-bottom: 30px;
        }
        .marquee-text {
            display: inline-block;
            white-space: nowrap;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.9rem;
            color: #00ff00;
            animation: scroll-left 15s linear infinite;
        }
        @keyframes scroll-left {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .social-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .soc-btn {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.8rem;
            color: #fff;
            padding: 12px 20px;
            text-decoration: none;
            border: 2px solid transparent;
            transition: 0.2s;
            border-radius: 8px;
        }
        .soc-btn.osu { background-color: var(--btn-osu); }
        .soc-btn.bsky { background-color: var(--btn-bsky); }
        .soc-btn.steam { background-color: var(--btn-steam); border-color: #555; }
        
        .soc-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255,255,255,0.1);
        }
        
        .divider {
            width: 100%;
            height: 2px;
            background-color: var(--dr-border);
            margin: 30px 0;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }
        .card {
            background: #000;
            border: 2px solid var(--dr-border);
            color: var(--dr-text);
            text-decoration: none;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            transition: 0.1s;
        }
        .card-content {
            display: flex;
            flex-direction: column;
            gap: 5px;
            text-align: center;
        }
        .card-title {
            font-family: 'Press Start 2P', cursive;
            font-size: 1rem;
        }
        .card-desc {
            color: #888;
            font-size: 0.9rem;
        }
        .card:hover {
            border-color: #fff;
            background: #222;
        }

        #corner-cooler {
            position: fixed;
            bottom: 20px;
            left: 20px;
            transition: transform 0.2s ease-in-out;
            cursor: pointer;
            z-index: 100;
            opacity: 0.5;
        }
        #corner-cooler:hover {
            transform: scale(1.1);
            opacity: 1;
        }
        #corner-cooler img {
            width: 90px;
            height: auto;
            image-rendering: pixelated;
        }
        #museum-door {
            position: fixed;
            bottom: 20px;
            right: 20px;
            transition: transform 0.2s ease-in-out;
            cursor: pointer;
            z-index: 100;
            opacity: 0.5;
        }
        #museum-door:hover {
            transform: scale(1.1);
            opacity: 1;
        }
        #museum-door img {
            width: 90px;
            height: auto;
            image-rendering: pixelated;
        }
        
        @media (max-width: 600px) {
            #corner-cooler img, #museum-door img { width: 60px; }
            .header-text { font-size: 1rem; }
            .soc-btn { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>

    <a href="https://gnusinrat.github.io/rarercats" id="corner-cooler" target="_blank" rel="noopener noreferrer">
        <img src="https://gnusinrat.github.io/assets/cooler.png" alt="Кулер">
    </a>

    <a href="museum/index.html" id="museum-door">
        <img src="https://gnusinrat.github.io/assets/ShortcutDoor.gif" alt="Музей">
    </a>

    <div class="container">
            
            <div class="header-text">
                переделываю сайт.<br><br>
                работы идут с 20 июля 2026 года
            </div>

            <div class="marquee-container">
                <div class="marquee-text">помойся с сыром v3. версия v4 завершена на 10.00%</div>
            </div>

            <div class="social-buttons">
                <a href="https://osu.ppy.sh/users/32021404" class="soc-btn osu" target="_blank">ПРОФИЛЬ OSU</a>
                <a href="https://bsky.app/profile/xn--80avikb.art" class="soc-btn bsky" target="_blank">БЛЮСКАЙ</a>
                <a href="https://steamcommunity.com/id/vskyofficial" class="soc-btn steam" target="_blank">СТИМ</a>
            </div>

            <div class="divider"></div>

            <div class="cards">
                <a href="https://gnusinrat.github.io/paint" class="card">
                    <div class="card-content">
                        <span class="card-title">HTMPen</span>
                        <span class="card-desc">Рисовалка с Gemini API</span>
                    </div>
                </a>
                
                <a href="docs/anomalies/index.html" class="card">
                    <div class="card-content">
                        <span class="card-title">awesomium вики</span>
                        <span class="card-desc">Секретные архивы</span>
                    </div>
                </a>

                <a href="weather.html" class="card">
                    <div class="card-content">
                        <span class="card-title">ветеркомм</span>
                        <span class="card-desc">Погода (WIP)</span>
                    </div>
                </a>
            </div>

    </div>

</body>
</html>
