<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>badgester's cyber world</title>
    <!-- Пиксельные шрифты с поддержкой кириллицы -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --dr-bg: #020208;
            --dr-grid: #800080; /* Фиолетовая сетка боёв */
            --dr-text: #ffffff;
            --dr-border: #ffffff;
            --dr-green: #00ff00; /* Ralsei/Heal green */
            --dr-pink: #ff00ff; /* Susie magenta */
            --dr-cyan: #00ffff; /* Kris blue */
            --dr-yellow: #ffff00;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--dr-bg);
            /* Кибер-сетка на фоне */
            background-image: 
                linear-gradient(var(--dr-grid) 2px, transparent 2px),
                linear-gradient(90deg, var(--dr-grid) 2px, transparent 2px);
            background-size: 50px 50px;
            /* Анимация движения сетки как в битвах */
            animation: scrollGrid 3s linear infinite;
            color: var(--dr-text);
            font-family: 'Pixelify Sans', sans-serif;
            font-size: 1.4rem;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        @keyframes scrollGrid {
            0% { background-position: 0px 0px; }
            100% { background-position: -50px 50px; }
        }

        .container {
            width: 100%;
            max-width: 900px;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 25px;
            margin-top: 20px;
        }

        .dr-box {
            background-color: #000;
            border: 4px solid var(--dr-border);
            border-radius: 8px; /* Слегка скругленные углы в стиле Deltarune */
            padding: 20px;
            box-shadow: inset 0 0 0 2px #000, 0 0 10px rgba(128, 0, 128, 0.4);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-family: 'Press Start 2P', monospace;
            font-size: 2rem;
            color: var(--dr-text);
            text-transform: uppercase;
            text-shadow: 3px 3px 0px var(--dr-pink);
        }

        /* Кнопка Спотлайта (в стиле ДЕЙСТВИЯ) */
        .act-btn {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.8rem;
            color: var(--dr-yellow);
            text-decoration: none;
            border: 2px solid var(--dr-yellow);
            padding: 8px 12px;
            background: #000;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .act-btn:hover {
            background: var(--dr-yellow);
            color: #000;
        }

        .dialogue-box {
            display: flex;
            gap: 15px;
            font-size: 1.8rem;
            line-height: 1.4;
            min-height: 120px;
        }

        .dialogue-asterisk {
            font-family: 'Press Start 2P', monospace;
            font-size: 1.2rem;
            margin-top: 5px;
            animation: bob 1s infinite alternate;
        }

        @keyframes bob {
            from { transform: translateY(0); }
            to { transform: translateY(3px); }
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }

        .card {
            background-color: #000;
            border: 4px solid var(--dr-border);
            color: var(--dr-text);
            text-decoration: none;
            padding: 20px 20px 20px 45px; /* Отступ слева для души */
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
            transition: all 0.1s;
        }

        /* Векторный спрайт Красной Души */
        .card::before {
            content: '';
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><path fill="%23ff0000" d="M8,15 L1,8 L1,3 L4,0 L7,0 L8,2 L9,0 L12,0 L15,3 L15,8 Z"/></svg>');
            background-size: contain;
            background-repeat: no-repeat;
            width: 18px;
            height: 18px;
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0;
            transition: 0.1s;
        }

        .card:hover {
            border-color: var(--dr-cyan);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
            transform: scale(1.02);
            cursor: pointer;
        }

        .card:hover::before {
            opacity: 1;
        }

        .card-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.9rem;
            text-transform: uppercase;
            line-height: 1.4;
        }

        .card-desc {
            font-size: 1.3rem;
            opacity: 0.8;
            color: #b3b3b3;
        }

        .card:hover .card-desc {
            color: var(--dr-text);
        }

        /* Спец. цвет для переключения языка */
        .lang-card {
            border-color: var(--dr-pink);
        }
        
        .lang-card:hover {
            border-color: var(--dr-pink);
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.4);
        }
        
        .lang-card:hover .card-title {
            color: var(--dr-pink);
        }

        @media (max-width: 600px) {
            .header-top {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER BOX -->
        <div class="dr-box">
            <div class="header-top">
                <h1 id="t-title">чё как?</h1>
                <a href="spotlight.html" class="act-btn" title="Team Raylit Spotlight">
                    <span>[ РАДАР ]</span>
                </a>
            </div>
        </div>

        <!-- DIALOGUE BOX (Description) -->
        <div class="dr-box dialogue-box">
            <div class="dialogue-asterisk">*</div>
            <p id="t-desc"></p>
        </div>

        <!-- CARDS / DIRECTORY -->
        <div class="cards">
            <a href="https://gnusinrat.github.io/paint.html" class="card">
                <span class="card-title">HTMPen</span>
                <span class="card-desc" id="t-htm">Рисовалка с Gemini API</span>
            </a>
            
            <a href="https://gnusinrat.github.io/maxclicker.html" class="card">
                <span class="card-title">MaxClicker</span>
                <span class="card-desc" id="t-clicker">Кликер</span>
            </a>
            
            <a href="https://badgester.neocities.org" class="card">
                <span class="card-title" id="t-old-title">Старый сайт</span>
                <span class="card-desc" id="t-old-desc">Архив на Neocities</span>
            </a>
            
            <a href="https://gnusinrat.github.io/top.html" class="card">
                <span class="card-title" id="t-top-title">Мои топы</span>
                <span class="card-desc" id="t-top-desc">Любимые блюда и животные</span>
            </a>
            
            <a href="https://gnusinrat.github.io/rabbits.html" class="card">
                <span class="card-title" id="t-rab-title">Кролики</span>
                <span class="card-desc" id="t-rab-desc">кролики</span>
            </a>

            <a href="https://gnusinrat.github.io/procedural.html" class="card">
                <span class="card-title" id="t-zen-title">дзен</span>
                <span class="card-desc">💖☮️⚛️</span>
            </a>

            <a href="https://gnusinrat.github.io/webmap.html" class="card">
                <span class="card-title" id="t-map-title">Карта сайта</span>
                <span class="card-desc" id="t-map-desc">Визуальная карта всех страниц</span>
            </a>

            <!-- LANGUAGE SWITCHER -->
            <a href="#" class="card lang-card" id="lang-switch">
                <span class="card-title" id="t-lang-title">US English version</span>
                <span class="card-desc" id="t-lang-desc">Switch to English</span>
            </a>
        </div>
    </div>

    <script>
        const dict = {
            ru: {
                title: "чё как?",
                desc: "новый сайт значкестера/mostlyengineer/пилота. я не буду тратить много времени на эту страницу, так что чекай другие:",
                htm: "Рисовалка с Gemini API",
                clicker: "Кликер",
                oldTitle: "Старый сайт",
                oldDesc: "Архив на Neocities",
                topTitle: "Мои топы",
                topDesc: "Любимые блюда и животные",
                rabTitle: "Кролики",
                rabDesc: "кролики",
                zenTitle: "дзен",
                mapTitle: "Карта сайта",
                mapDesc: "Визуальная карта всех страниц",
                langTitle: "US English version",
                langDesc: "Switch to English"
            },
            en: {
                title: "what's up?",
                desc: "this is badgester/mostlyengineer/pilot/pilotgc's new website. i'm not going to spend too much time on this page so check out the other pages:",
                htm: "Drawing thing made with Gemini [RUSSIAN]",
                clicker: "Clicker game",
                oldTitle: "Old Website",
                oldDesc: "Archived on Neocities",
                topTitle: "My Tops",
                topDesc: "Favorite food and animals",
                rabTitle: "Rabbits",
                rabDesc: "rabbits",
                zenTitle: "zen",
                mapTitle: "Sitemap",
                mapDesc: "Visual map of all pages",
                langTitle: "🇷🇺 Русская версия",
                langDesc: "Поменять на русский"
            }
        };

        let currentLang = 'ru'; 
        let typingTimeout; // Для остановки печати, если быстро переключить язык

        function typeWriterEffect(text) {
            const descElement = document.getElementById('t-desc');
            descElement.innerHTML = ""; // Очищаем поле
            clearTimeout(typingTimeout); // Сбрасываем прошлую анимацию
            
            let i = 0;
            function typeNext() {
                if (i < text.length) {
                    descElement.innerHTML += text.charAt(i);
                    i++;
                    // Задержка печати. В Deltarune она быстрая и ритмичная
                    typingTimeout = setTimeout(typeNext, 30);
                }
            }
            typeNext();
        }

        // Запуск при первой загрузке
        window.onload = () => {
            typeWriterEffect(dict[currentLang].desc);
        };

        const langBtn = document.getElementById('lang-switch');

        langBtn.addEventListener('click', (e) => {
            e.preventDefault();
            
            currentLang = currentLang === 'ru' ? 'en' : 'ru';
            
            document.documentElement.lang = currentLang;
            document.title = currentLang === 'ru' ? "badgester's cyber world" : "badgester's cyber world";
            
            document.getElementById('t-title').innerText = dict[currentLang].title;
            
            // Запускаем эффект печати для нового языка
            typeWriterEffect(dict[currentLang].desc);

            document.getElementById('t-htm').innerText = dict[currentLang].htm;
            document.getElementById('t-clicker').innerText = dict[currentLang].clicker;
            document.getElementById('t-old-title').innerText = dict[currentLang].oldTitle;
            document.getElementById('t-old-desc').innerText = dict[currentLang].oldDesc;
            document.getElementById('t-top-title').innerText = dict[currentLang].topTitle;
            document.getElementById('t-top-desc').innerText = dict[currentLang].topDesc;
            document.getElementById('t-rab-title').innerText = dict[currentLang].rabTitle;
            document.getElementById('t-rab-desc').innerText = dict[currentLang].rabDesc;
            document.getElementById('t-zen-title').innerText = dict[currentLang].zenTitle;
            document.getElementById('t-map-title').innerText = dict[currentLang].mapTitle;
            document.getElementById('t-map-desc').innerText = dict[currentLang].mapDesc;
            
            document.getElementById('t-lang-title').innerText = dict[currentLang].langTitle;
            document.getElementById('t-lang-desc').innerText = dict[currentLang].langDesc;
        });
    </script>
</body>
</html>
